name: Plugin Capabilities

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    name: Registry, package and TypeScript checks
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: '7.9 第一周/Zhuhai/Pomegranate/Pomegranate'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check capability registry consistency
        run: npm run plugin:capabilities:check

      - name: Test capability registry and package permissions
        run: node --test scripts/plugin-capabilities.test.mjs scripts/plugin-package.test.mjs

      - name: TypeScript noEmit
        run: npm exec -- tsc --noEmit

  rust:
    name: Rust registry consistency
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file \
            patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '7.9 第一周/Zhuhai/Pomegranate/Pomegranate/src-tauri -> target'

      - name: Test generated registry consistency
        working-directory: '7.9 第一周/Zhuhai/Pomegranate/Pomegranate/src-tauri'
        run: cargo test services::plugin_capabilities::tests
