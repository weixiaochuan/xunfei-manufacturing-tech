# Local development baseline for the Casdoor container.
# Compose overrides database connection fields with environment variables so
# real local credentials never need to be committed to this file.

appname = casdoor
httpport = 8000
runmode = dev
copyrequestbody = true

driverName = postgres
dataSourceName = user=local-placeholder password=local-placeholder host=postgres port=5432 sslmode=disable dbname=casdoor
dbName = casdoor
tableNamePrefix =
showSql = false

redisEndpoint =
defaultStorageProvider =
isCloudIntranet = false
authState = "casdoor"
origin = http://localhost:8000
originFrontend = http://localhost:8000
isDemoMode = false
defaultApplication = "app-built-in"
