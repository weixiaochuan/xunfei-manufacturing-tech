# Production container baseline. Compose supplies database credentials and
# public origins through server-only environment variables.

appname = casdoor
httpport = 8000
runmode = prod
copyrequestbody = true

driverName = postgres
dataSourceName = user=cloud-placeholder password=cloud-placeholder host=postgres port=5432 sslmode=disable dbname=casdoor
dbName = casdoor
tableNamePrefix =
showSql = false

redisEndpoint =
defaultStorageProvider =
isCloudIntranet = false
authState = "casdoor"
origin =
originFrontend =
isDemoMode = false
defaultApplication = "app-built-in"
