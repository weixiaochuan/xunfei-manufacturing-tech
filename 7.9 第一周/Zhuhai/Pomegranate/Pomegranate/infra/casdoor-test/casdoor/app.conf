# Isolated Casdoor TEST container baseline. Compose supplies the real test-only
# database credentials and loopback origin through a private environment file.

appname = casdoor
httpport = 8000
runmode = prod
copyrequestbody = true

driverName = postgres
dataSourceName = user=test-placeholder password=test-placeholder host=postgres-test port=5432 sslmode=disable dbname=casdoor_test
dbName = casdoor_test
tableNamePrefix =
showSql = false

redisEndpoint =
defaultStorageProvider =
isCloudIntranet = false
authState = "casdoor-test"
origin =
originFrontend =
isDemoMode = false
defaultApplication = "app-built-in"
