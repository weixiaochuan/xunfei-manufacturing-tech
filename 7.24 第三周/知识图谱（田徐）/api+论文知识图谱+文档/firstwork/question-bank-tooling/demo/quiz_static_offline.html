<style>
  :root{ --ink:#1a2233; --sub:#6b7686; --line:#e6e9ef; --ok:#137a4b; --bad:#c0392b; --brand:#2d5bd7; --bg:#f6f7fb; }
  *{box-sizing:border-box}
  body{font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
       margin:0;background:var(--bg);color:var(--ink);line-height:1.6}
  .wrap{max-width:760px;margin:0 auto;padding:24px 18px 80px}
  h1{font-size:20px;margin:8px 0 2px}
  .meta{color:var(--sub);font-size:13px;margin-bottom:18px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  select,button{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  button{cursor:pointer}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px;
        box-shadow:0 1px 2px rgba(20,30,60,.04)}
  .tag{display:inline-block;font-size:12px;color:var(--sub);background:#f0f2f7;border-radius:999px;padding:2px 10px;margin-right:6px}
  .stem{font-size:16px;font-weight:600;margin:10px 0 14px;white-space:pre-wrap}
  .opt{display:block;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);
       border-radius:12px;background:#fff;margin:8px 0;transition:.15s}
  .opt:hover{border-color:var(--brand)}
  .opt.correct{border-color:var(--ok);background:#eafaf1}
  .opt.wrong{border-color:var(--bad);background:#fdecea}
  .opt:disabled{cursor:default;opacity:1}
  .feedback{margin-top:12px;padding:14px;border-radius:12px;background:#f7f9ff;border:1px solid #e2e8fb;font-size:14px}
  .feedback .ok{color:var(--ok);font-weight:700}
  .feedback .bad{color:var(--bad);font-weight:700}
  .src{color:var(--sub);font-size:12px;margin-top:8px}
  .calc pre{white-space:pre-wrap;background:#f7f9ff;border:1px solid #e2e8fb;border-radius:12px;padding:12px;font-size:13px}
  .foot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
        padding:12px 18px;display:flex;justify-content:space-between;align-items:center}
  .foot .score{font-weight:700}
  .note{color:var(--sub);font-size:12px;margin-top:24px;border-top:1px dashed var(--line);padding-top:14px}
</style>

术最初的主要加工方式是什么？", "options": ["在机床上用切削方法加工", "电加工", "光学加工", "化学加工"], "answer": "在机床上用切削方法加工", "explanation": "知识点原文明确指出，机械制造技术最初是用机械来加工零件的技术，即在机床上用切削方法来加工。而电加工、光学加工、化学加工等是后来出现的非机械加工方法，属于先进制造技术的范畴。三个干扰项均属于对初始方式与后来发展的混淆。", "bloom": "记忆", "model": "deepseek/deepseek-chat"}, {"id": "Q_83765f51f2", "chapter": "第一章_绪论", "node": "KN_CH1_002", "type": "单选", "stem": "根据原文，以下哪项制造技术直接推动了工业革命和大工业生产的出现？", "options": ["蒸汽机制造技术", "内燃机制造技术", "集成电路制造技术", "纳米技术"], "answer": "蒸汽机制造技术", "explanation": "正确答案是蒸汽机制造技术，因为原文明确指出“蒸汽机制造技术带来了工业革命和大工业生产”。干扰项A（内燃机制造技术）对应误区：混淆内燃机与蒸汽机的作用；干扰项B（集成电路制造技术）对应误区：误认为集成电路推动工业革命，实际它左右了现代计算机水平；干扰项C（纳米技术）对应误区：误认为纳米技术推动工业革命，实际它开创了微型机械。", "bloom": "记忆", "model": "deepseek/deepseek-chat"}, {"id": "Q_084f425a29", "chapter": "第一章_绪论", "node": "KN_CH1_003", "type": "单选", "stem": "根据制造系统的组成，以下哪项是制造系统的本质要素？", "options": ["物质流", "信息流", "能量流", "资金流"], "answer": "物质流", "explanation": "根据知识点原文，制造系统由物质流、能量流和信息流组成，其中物质流是本质，能量流是动力，信息流是控制。因此物质流是本质要素。选项A正确。选项B信息流是控制，选项C能量流是动力，均非本质。选项D资金流不属于制造系统的组成要素，是常见误区。", "bloom": "记忆", "model": "deepseek/deepseek-chat"}, {"id": "Q_ed0c9fac1d", "chapter": "第一章_绪论", "node": "KN_CH1_004", "type": "单选", "stem": "根据知识点原文，制造技术在所有工业中的地位是：", "options": ["制造技术是所有工业的支柱", "制造技术仅对机械、电子行业重要", "冶金行业作为原材料行业，不需要制造技术支持", "建筑行业主要依靠施工，与制造技术无关"], "answer": "制造技术是所有工业的支柱", "explanation": "正确答案为“制造技术是所有工业的支柱”，因为原文明确指出“制造业是一个支柱产业”，且“各个行业都要有制造业的支持”。干扰项A缩小了制造技术的适用范围，干扰项B和C分别对应冶金和建筑行业不需制造技术的典型误区，均与原文相悖。", "bloom": "记忆", "model": "deepseek/deepseek-chat"}, {"id": "Q_d6e003d901", "chapter": "第一章_绪论", "node": "KN_CH1_005", "type": "单选", "stem": "根据原文，第二次世界大战后，哪两个国家因一直重视制造业而使国力得以很快恢复？", "options": ["日本和德国", "日本和美国", "德国和美国", "英国和法国"], "answer": "日本和德国", "explanation": "原文明确提到“第二次世界大战以后，日本、德国一直重视制造业，国力得以很快恢复。”因此正确选项是日本和德国。干扰项A和B混淆了美国的情况，美国在50、60年代未能重视制造业，并非战后恢复国力的国家；干扰项D虚构了原文未提及的英国和法国，学生可能凭印象误以为它们也是制造业强国。", "bloom": "记忆", "model": "deepseek/deepseek-chat"}, {"id": "Q_b0ae6340cf", "chapter": "第一章_绪论", "node": "KN_CH1_001", "type": "单选", "stem": "根据知识点原文，先进制造技术综合应用了哪些领域的技术？", "options": ["机械和电子技术", "机械、电子、信息、材料、能源和管理技术", "仅机械和信息技术", "光学和化学加工技术"], "answer": "机械、电子、信息、材料、能源和管理技术", "explanation": "正确项准确对应知识点原文中先进制造技术所综合应用的技术领域，即机械、电子、信息、材料、能源和管理。干扰项A错在只列举了部分技术，属于以偏概全的认知误区；干扰项C错在过于局限，忽略了其他必要领域，属于片面理解；干扰项D错在将非机械加工方法误当作先进制造技术的核心，属于混淆概念的认知误区。", "bloom": "记忆", "model": "xinghuo_x2/spark-x"}, {"id": "Q_d42abafff2", "chapter": "第一章_绪论", "node": "KN_CH1_004", "type": "单选", "stem": "根据知识点原文，制造技术的特性表现为以下哪一选项？", "options": ["只有普遍性，没有特殊性", "只有特殊性，没有普遍性", "既有普遍性又有特殊性", "既无普遍性也无特殊性"], "answer": "既有普遍性又有特殊性", "explanation": "解析：正确项'既有普遍性又有特殊性'准确反映了知识点原文中'制造技术既有普遍性、基础性的一面，又有特殊性、专业性的一面'的描述。干扰项'只有普遍性，没有特殊性'错在学生可能忽视制造技术的特殊性，陷入单一认知误区；'只有特殊性，没有普遍性'错在学生可能低估制造技术的普遍性，导致片面理解；'既无普遍性也无特殊性'错在学生可能完全否定制造技术的基本属性，形成根本误解。", "bloom": "记忆", "model": "xinghuo_x2/spark-x"}, {"id": "Q_dfbb77da41", "chapter": "第一章_绪论", "node": "KN_CH1_005", "type": "单选", "stem": "根据教材内容，克林顿总统执政后推行了以下哪项制造技术战略？", "options": ["21世纪制造企业战略", "精益生产战略", "工业4.0战略", "全面质量管理战略"], "answer": "21世纪制造企业战略", "explanation": "解析：正确选项'21世纪制造企业战略'是克林顿总统执政后明确推行的制造技术战略。选项B'精益生产战略'错误，因为精益生产源于日本的丰田生产方式，与克林顿时期无关。选项C'工业4.0战略'错误，因为这是21世纪提出的概念，远晚于克林顿执政时期。选项D'全面质量管理战略'错误，因为这是一种较早的管理方法，且原文未提及克林顿推行此战略。", "bloom": "记忆", "model": "xinghuo_x2/spark-x"}, {"id": "Q_b748baa7fa", "chapter": "第一章_绪论", "node": "KN_CH1_007", "type": "单选", "stem": "关于“工艺和设计一体化”在不同制造阶段的体现，下列哪一项说法是正确的？", "options": ["手工业生产阶段，制造主要依靠工匠手艺，体脑结合，设计与工艺一体，技术水平取决于制造经验。", "大工业生产阶段，设计与工艺实现了高度集成，通过计算机仿真和虚拟制造来完成。", "手工业生产阶段，设计和工艺是分开的，以满足大批量生产的需求。", "虚拟现实工业生产阶段，设计与工艺才开始结合，此前的阶段两者是完全分离的。"], "answer": "手工业生产阶段，制造主要依靠工匠手艺，体脑结合，设计与工艺一体，技术水平取决于制造经验。", "explanation": "正确项准确对应原文对手工业生产阶段的描述：靠工匠手艺、体脑结合、设计与工艺一体、技术水平取决于制造经验。干扰项B错误在于把第三阶段（虚拟现实工业生产阶段）的“高度集成”特征前置到了第二阶段；干扰项C错误在于将大工业阶段“设计与工艺分开”的特点颠倒到手工业阶段；干扰项D错误在于否定了手工业阶段已有的“设计与工艺一体”，误以为只有虚拟现实阶段才开始结合。", "bloom": "分析", "model": "xinghuo_x2/spark-x"}, {"id": "Q_1982ab3a7b", "chapter": "第一章_绪论", "node": "KN_CH1_008", "type": "单选", "stem": "在现代机械制造工程中，根据材料成形机理，加工工艺被明确分为哪三大类？", "options": ["去除加工、结合加工、变形加工", "热加工、冷加工、表面加工", "切削加工、磨削加工、电火花加工", "附着加工、注入加工、连接加工"], "answer": "去除加工、结合加工、变形加工", "explanation": "正确项'去除加工、结合加工、变形加工'严格对应原文三大类分类，体现现代成形机理的核心框架。干扰项'热加工、冷加工、表面加工'错误源于固守传统二分法，忽视分类依据已转向机理；'切削加工、磨削加工、电火花加工'仅列举去除加工的具体方法，犯了以实例替代大类的错误；'附着加工、注入加工、连接加工'则混淆了结合加工的内部子类与顶层分类，未能识别其从属地位。", "bloom": "理解", "model": "xinghuo_x2/spark-x"}, {"id": "Q_5a10adae0a", "chapter": "第七章_机械制造工艺理论和技术的发展", "node": "KN_CH7_001", "type": "单选", "stem": "根据制造工艺的重要性，工艺在制造技术中被视为：", "options": ["灵魂、核心和关键", "辅助环节", "与设计无关", "次要因素"], "answer": "灵魂、核心和关键", "explanation": "正确答案是'灵魂、核心和关键'，原文明确指出'工艺是制造技术的灵魂、核心和关键'。干扰项分别对应误区：认为工艺是辅助的、与设计无关的、次要的，均与原文强调的核心地位相悖。", "bloom": "记忆", "model": "deepseek/deepseek-chat"}, {"id": "Q_233971cf7a", "chapter": "第七章_机械制造工艺理论和技术的发展", "node": "KN_CH7_002", "type": "单选", "stem": "根据知识点原文，关于工艺与工具设备的关系，以下哪项说法是正确的？", "options": ["工艺方法决定了所用工具和设备，工具设备的发展又反过来提升工艺性能", "工艺方法完全由工具和设备决定，没有工具就没有工艺", "工艺方法与工具设备无关，各自独立发展", "工具设备的发展总是先于工艺方法的突破"], "answer": "工艺方法决定了所用工具和设备，工具设备的发展又反过来提升工艺性能", "explanation": "正确答案基于原文：工艺方法决定所用工具设备，而工具设备的发展又提升工艺性能。干扰项A错在认为工艺完全由工具决定，忽视工艺的主动性；B错在割裂二者关系；C错在颠倒顺序，原文强调工艺突破在先。", "bloom": "记忆", "model": "deepseek/deepseek-chat"}, {"id": "Q_42b584b773", "chapter": "第七章_机械制造工艺理论和技术的发展", "node": "KN_CH7_003", "type": "单选", "stem": "下列哪一项属于先进制造工艺理论的内容？", "options": ["加工成形机理", "特种加工", "并行工程", "智能制造技术"], "answer": "加工成形机理", "explanation": "根据知识点原文，先进制造工艺理论包括加工成形机理、精度原理、相似性原理和成组技术、工艺决策原理和优化原理。特种加工属于现代制造工艺方法，并行工程属于先进制造模式，智能制造技术属于制造技术，均不属于工艺理论。", "bloom": "记忆", "model": "deepseek/deepseek-chat"}, {"id": "Q_4d1b357360", "chapter": "第七章_机械制造工艺理论和技术的发展", "node": "KN_CH7_004", "type": "单选", "stem": "关于分层加工，以下哪种说法是正确的？", "options": ["分层加工是增材制造的基础，其分层形式包括平面分层、曲面分层和卷绕分层", "分层加工属于变形（流动）加工的一种", "分层加工只能采用平面分层的方式", "分层加工是将零件沿任意方向按相同层厚分层并堆积成形"], "answer": "分层加工是增材制造的基础，其分层形式包括平面分层、曲面分层和卷绕分层", "explanation": "正确答案正确描述了分层加工的分类及其与增材制造的关系。干扰项A将分层加工误归为变形加工，实际上分层加工属于结合（堆积）加工；干扰项B只承认平面分层，遗漏了其他形式；干扰项C未强调分层需沿某一方向且层厚可不同，表述不准确。", "bloom": "理解", "model": "deepseek/deepseek-chat"}, {"id": "Q_bc49208be1", "chapter": "第七章_机械制造工艺理论和技术的发展", "node": "KN_CH7_005", "type": "单选", "stem": "关于内加工方式，以下哪种说法是正确的？", "options": ["内加工是利用激光束等在透明材料内部加工工件，加工完成后工件留在材料内部，切开材料后才能取出。", "内加工是在材料外部进行加工，加工完成后工件可直接取出。", "内加工只能用于加工非透明材料。", "内加工完成后工件可直接从材料中取出，无需切开材料。"], "answer": "内加工是利用激光束等在透明材料内部加工工件，加工完成后工件留在材料内部，切开材料后才能取出。", "explanation": "正确答案准确描述了内加工的定义和特点。干扰项1混淆了内加工与外切削方式；干扰项2错误认为内加工不能用于透明材料；干扰项3忽视了内加工后需切开材料才能取出工件的步骤。", "bloom": "理解", "model": "deepseek/deepseek-chat"}, {"id": "Q_89dcaaf51e", "chapter": "第七章_机械制造工艺理论和技术的发展", "node": "KN_CH7_006", "type": "单选", "stem": "以下哪种能源不属于零件成形所使用的能源？", "options": ["力", "电", "磁", "激光"], "answer": "磁", "explanation": "根据知识点原文，零件成形所使用的能源有力、电、声、化学、电子、离子、激光等，不包括磁。选项A、B、D均在原文中提及，而选项C“磁”未被列入，因此正确答案为磁。", "bloom": "记忆", "model": "deepseek/deepseek-chat"}, {"id": "Q_64fa4062dd", "chapter": "第七章_机械制造工艺理论和技术的发展", "node": "KN_CH7_007", "type": "单选", "stem": "在扫描探针显微加工中，若需在原子尺度上对材料进行加工和操纵，以下哪种加工方式最可能涉及将原子从一个位置精确移动到另一个位置以构建特定结构？", "options": ["原子搬迁和排列重组", "原子去除与增添", "雕刻加工", "扫描隧道显微加工"], "answer": "原子搬迁和排列重组", "explanation": "正确答案是‘原子搬迁和排列重组’，因为该方式直接涉及将原子从一个位置精确移动到另一个位置以构建结构。原子去除与增添主要涉及移除或添加原子，不强调移动；雕刻加工通常涉及去除材料；扫描隧道显微加工是加工技术，不是具体加工方式。", "bloom": "分析", "model": "deepseek/deepseek-chat"}, {"id": "Q_400bd14897", "chapter": "第七章_机械制造工艺理论和技术的发展", "node": "KN_CH7_008", "type": "单选", "stem": "在纳米生物加工中，生物去除成形加工与生物约束成形加工的主要区别在于：", "options": ["前者利用细菌的生理特性去除材料，后者通过控制微生物生长过程并利用化学镀进行约束成形", "前者适用于金属材料，后者仅适用于非金属材料", "前者需要化学镀辅助，后者不需要", "前者加工微型齿轮，后者只能加工简单形状"], "answer": "前者利用细菌的生理特性去除材料，后者通过控制微生物生长过程并利用化学镀进行约束成形", "explanation": "正确答案准确概括了两种加工方式的本质区别：生物去除成形依赖细菌的生理特性（如氧化亚铁硫杆菌去除金属），生物约束成形则通过控制微生物生长并结合化学镀实现约束成形。干扰项A错误地将生物约束成形限制于非金属材料，实际上其制备的金属化微生物细胞可用于金属微结构；干扰项B颠倒了化学镀的归属，化学镀是生物约束成形的关键步骤；干扰项C无依据地限制了生物约束成形的形状能力，原文未提及此限制。", "bloom": "分析", "model": "deepseek/deepseek-chat"}, {"id": "Q_dcdda9b8ad", "chapter": "第七章_机械制造工艺理论和技术的发展", "node": "KN_CH7_009", "type": "单选", "stem": "在机械加工原则中，关于“继承性原则”和“创造性原则”的描述，以下哪一项是正确的？", "options": ["继承性原则要求加工机床的精度低于工件精度，以体现“母性”特征。", "创造性原则中的“直接创造性”是指用高精度机床直接加工出高精度工件。", "“以粗干精”属于间接创造性原则的典型应用。", "间接创造性原则是先通过直接创造性手段制造高精度机床，再用该机床加工高精度零件。"], "answer": "间接创造性原则是先通过直接创造性手段制造高精度机床，再用该机床加工高精度零件。", "explanation": "正确选项描述了间接创造性原则的步骤：先用直接创造性制造高精度机床，再用于加工。其他选项均有误：A选项违背继承性原则中“机床精度应高于工件精度”的要求；B选项将直接创造性错误理解为用高精度机床加工高精度工件，而直接创造性是用低精度机床通过工艺手段加工高精度工件；C选项中“以粗干精”是直接创造性原则的典型应用，而非间接创造性。", "bloom": "理解", "model": "deepseek/deepseek-chat"}, {"id": "Q_118ec908f6", "chapter": "第七章_机械制造工艺理论和技术的发展", "node": "KN_CH7_010", "type": "单选", "stem": "在机械加工中，工件定位时，若一个自由度被两个或两个以上的定位元件重复限制，这种定位状态称为？", "options": ["过定位", "欠定位", "不完全定位", "完全定位"], "answer": "过定位", "explanation": "根据六点定位原理，过定位是指同一自由度被重复约束的状态。选项B欠定位是应约束的自由度未约束，不允许；选项C不完全定位是约束少于六个但满足加工要求；选项D完全定位是六个自由度全约束。因此，只有过定位符合题意。", "bloom": "理解", "model": "deepseek/deepseek-chat"}, {"id": "Q_afe6bb9773", "chapter": "第七章_机械制造工艺理论和技术的发展", "node": "KN_CH7_011", "type": "单选", "stem": "根据尺寸链原理，以下哪项是关于尺寸链的数学模型建立和求解方法的正确描述？", "options": ["尺寸链的求解方法包括极值法和概率法", "尺寸链只能通过极值法求解", "尺寸链的数学模型只适用于线性尺寸链", "尺寸链原理仅涉及工艺尺寸链"], "answer": "尺寸链的求解方法包括极值法和概率法", "explanation": "尺寸链原理明确指出，针对线性尺寸链和角度尺寸链、工艺尺寸链和装配尺寸链，提出了求解方法（极值法、概率法等）。因此正确答案是A。选项B错误在于忽略了概率法；选项C错误在于忽略了角度尺寸链等；选项D错误在于忽略了装配尺寸链等。", "bloom": "理解", "model": "deepseek/deepseek-chat"}, {"id": "Q_05065296b0", "chapter": "第七章_机械制造工艺理论和技术的发展", "node": "KN_CH7_012", "type": "单选", "stem": "在机械制造中，分布曲线法的主要作用是：", "options": ["判断加工误差的性质，如常值系统误差和随机误差", "实时监控加工过程中的质量波动", "直接消除所有加工误差", "计算加工误差的具体数值大小"], "answer": "判断加工误差的性质，如常值系统误差和随机误差", "explanation": "根据知识点原文，分布曲线法可判断加工误差的性质（常值系统误差、随机误差等），而精度曲线法（x̄—R图）用于实时监控加工过程质量波动。干扰项A混淆了两种方法的功能；B夸大了统计方法的作用；C将定性分析误认为定量计算。", "bloom": "理解", "model": "deepseek/deepseek-chat"}, {"id": "Q_441feade25", "chapter": "第七章_机械制造工艺理论和技术的发展", "node": "KN_CH7_013", "type": "单选", "stem": "在成组技术中，零件的分类成组方法的关键是：", "options": ["建立零件分类编码系统", "应用相似性原理", "设计成组工艺", "提高多品种小批量生产效率"], "answer": "建立零件分类编码系统", "explanation": "正确选项：根据知识点原文，零件的分类成组方法是成组技术的关键问题，常用方法为建立零件分类编码系统。干扰项A：相似性原理是成组技术的理论基础，不是关键问题，属于混淆理论基础与关键问题。干扰项B：成组工艺是成组技术的核心，不是关键问题，属于混淆核心与关键问题。干扰项C：提高多品种小批量生产效率是成组技术的效果或目的，不是关键问题，属于混淆目的与关键问题。", "bloom": "理解", "model": "deepseek/deepseek-chat"}, {"id": "Q_20101bdbc4", "chapter": "第七章_机械制造工艺理论和技术的发展", "node": "KN_CH7_014", "type": "单选", "stem": "下列关于特种加工特点的描述，哪一项是正确的？", "options": ["工具与工件直接接触，存在宏观切削力", "只能加工硬度较低的材料", "难以实现复杂形状的加工", "工具与工件不直接接触，无宏观切削力"], "answer": "工具与工件不直接接触，无宏观切削力", "explanation": "正确答案是“工具与工件不直接接触，无宏观切削力”，这符合特种加工的定义特点。选项A错在混淆了传统加工与特种加工；选项B错在认为特种加工只能加工低硬度材料，实际可加工任何硬度；选项C错在认为特种加工难以实现复杂形状，实际易于实现。", "bloom": "记忆", "model": "deepseek/deepseek-chat"}, {"id": "Q_6885a6c5aa", "chapter": "第七章_机械制造工艺理论和技术的发展", "node": "KN_CH7_003", "type": "单选", "stem": "以下哪项属于制造工艺理论的技术范畴？", "options": ["特种加工", "并行工程", "智能制造技术", "加工成形机理"], "answer": "加工成形机理", "explanation": "正确答案是'加工成形机理'，因为它属于制造工艺理论的技术范畴。干扰项中，'特种加工'属于现代制造工艺方法，而非工艺理论；'并行工程'属于先进制造模式；'智能制造技术'属于制造技术范畴，均与工艺理论混淆。", "bloom": "记忆", "model": "xinghuo/xop3qwen1b7"}, {"id": "Q_f036c866f4", "chapter": "第七章_机械制造工艺理论和技术的发展", "node": "KN_CH7_005", "type": "单选", "stem": "内加工与外切削方式的主要区别是什么？", "options": ["内加工是在材料外部进行的加工", "内加工适用于所有材料，包括透明材料", "内加工后工件可以直接取出，无需切开材料", "内加工是利用激光束在材料内部加工工件"], "answer": "内加工是利用激光束在材料内部加工工件", "explanation": "正确答案解释：内加工是利用激光束在透明材料内部加工工件，加工完成后工件留在材料内部，切开材料后才能取出。干扰项中，第一项混淆了内加工与外切削方式；第二项错误认为内加工不能应用于透明材料；第三项忽视了内加工后工件需切开取出的特点。", "bloom": "理解", "model": "xinghuo/xop3qwen1b7"}, {"id": "Q_8ca3af8fed", "chapter": "第七章_机械制造工艺理论和技术的发展", "node": "KN_CH7_007", "type": "单选", "stem": "扫描探针显微加工中，原子搬迁和排列重组属于哪种加工方式？", "options": ["原子去除与增添", "原子搬迁和排列重组", "雕刻加工", "原子尺度的移动"], "answer": "原子搬迁和排列重组", "explanation": "正确答案是‘原子搬迁和排列重组’，因为该方式属于扫描探针显微加工的主要加工方式之一，涉及原子的搬迁和排列重组。干扰项中，‘原子去除与增添’虽涉及原子操作，但误以为不包含移动，不符合题干描述；‘雕刻加工’混淆了加工方式与技术，错误地将扫描隧道显微加工视为技术名称；‘原子尺度的移动’误以为雕刻加工涉及移动，而实际上雕刻加工是去除材料，不涉及原子移动。", "bloom": "分析", "model": "xinghuo/xop3qwen1b7"}, {"id": "Q_8512c779dc", "chapter": "第七章_机械制造工艺理论和技术的发展", "node": "KN_CH7_009", "type": "单选", "stem": "机械加工中，继承性原则要求加工用的机床精度应如何与所加工工件的精度关系？", "options": ["应低于工件精度", "应等于工件精度", "应高于工件精度", "应高于或等于工件精度"], "answer": "应高于工件精度", "explanation": "正确答案是机床精度应高于工件精度，符合继承性原则中‘加工用的机床（工作母机）精度应高于所加工工件的精度’的要求。干扰项中，‘应低于工件精度’和‘应等于工件精度’均混淆了机床精度与工件精度的关系，属于认知误区。‘应高于或等于工件精度’则属于对原则描述的误解，但不符合严格要求。", "bloom": "理解", "model": "xinghuo/xop3qwen1b7"}, {"id": "Q_291f6170db", "chapter": "第七章_机械制造工艺理论和技术的发展", "node": "KN_CH7_011", "type": "单选", "stem": "尺寸链原理中，尺寸链的求解方法是否仅限于极值法？", "options": ["尺寸链的求解方法仅限于极值法", "尺寸链的求解方法包括极值法和概率法", "尺寸链的求解方法仅适用于线性尺寸链", "尺寸链的求解方法仅涉及工艺尺寸链"], "answer": "尺寸链的求解方法包括极值法和概率法", "explanation": "正确答案：尺寸链的求解方法包括极值法和概率法。干扰项1错误在于认为只有极值法，忽略了概率法；干扰项2正确，无误区；干扰项3错误在于认为仅适用于线性尺寸链，忽略了角度尺寸链；干扰项4错误在于认为仅涉及工艺尺寸链，忽略了装配尺寸链。", "bloom": "理解", "model": "xinghuo/xop3qwen1b7"}, {"id": "Q_fafb32d8cd", "chapter": "第七章_机械制造工艺理论和技术的发展", "node": "KN_CH7_013", "type": "单选", "stem": "成组技术的理论基础是什么？", "options": ["相似性原理", "成组工艺", "提高效率", "分类编码系统"], "answer": "相似性原理", "explanation": "正确答案是相似性原理，因为知识点原文明确指出相似性是成组技术的理论基础，成组工艺是核心。干扰项中，'成组工艺'混淆了核心与关键问题，'提高效率'混淆了目的与关键问题，'分类编码系统'混淆了理论基础与关键问题。", "bloom": "理解", "model": "xinghuo/xop3qwen1b7"}, {"id": "Q_f470d25ffe", "chapter": "第七章_机械制造工艺理论和技术的发展", "node": "KN_CH7_001", "type": "单选", "stem": "关于制造工艺的重要性，下列说法正确的是？", "options": ["工艺是制造技术的灵魂、核心和关键，是设计和制造的桥梁", "工艺只是产品制造过程中的辅助环节，其核心地位并不突出", "工艺与产品设计相互独立，设计的可行性不受工艺的制约", "产品质量主要取决于管理等因素，与工艺技术的关系并不密切"], "answer": "工艺是制造技术的灵魂、核心和关键，是设计和制造的桥梁", "explanation": "根据知识点原文，工艺是制造技术的灵魂、核心和关键，是设计和制造的桥梁，设计的可行性往往会受到工艺的制约，因此正确选项表述准确。干扰项一'工艺只是产品制造过程中的辅助环节'对应了认为工艺只是辅助工作、忽视其核心地位的认知误区；干扰项二'工艺与产品设计相互独立，设计的可行性不受工艺的制约'对应了认为工艺与设计相互独立、不理解工艺是设计与制造桥梁的认知误区；干扰项三'产品质量主要取决于管理等因素，与工艺技术的关系并不密切'对应了低估工艺重要性、认为产品质量主要取决于其他因素的认知误区。", "bloom": "记忆", "model": "ali_glm/glm-5.2"}, {"id": "Q_81edb90369", "chapter": "第七章_机械制造工艺理论和技术的发展", "node": "KN_CH7_002", "type": "单选", "stem": "根据“工艺是生产中最活跃的因素”这一知识点，关于工艺与设备的关系及工艺的作用，以下说法正确的是：", "options": ["有了某种工艺方法才有相应的工具和设备出现，且加工技术的发展往往是从工艺突破开始的", "工艺是由现有的加工设备和工具被动决定的，有什么样的设备才能产生什么样的工艺方法", "工艺与设备的发展是各自独立的，工艺方法不会影响工具和设备的发展水平", "加工技术的突破往往是从设备更新开始的，设备的发明推动了如电加工等新工艺方法的出现"], "answer": "有了某种工艺方法才有相应的工具和设备出现，且加工技术的发展往往是从工艺突破开始的", "explanation": "正确选项符合原文描述，即工艺方法的出现先于相应的工具和设备，且加工技术的发展往往是从工艺突破开始的。干扰项1错在认为工艺是被工具被动决定的，忽略了工艺的主动性和先导性；干扰项2错在割裂了工艺与设备的相互促进关系；干扰项3错在颠倒了顺序，原文明确指出是电加工方法的发明推动了相关设备的发展，而非设备推动工艺。", "bloom": "记忆", "model": "ali_glm/glm-5.2"}, {"id": "Q_6da67e1674", "chapter": "第七章_机械制造工艺理论和技术的发展", "node": "KN_CH7_003", "type": "单选", "stem": "下列选项中，属于先进制造工艺理论的是：", "options": ["精度原理", "特种加工", "并行工程", "智能制造技术"], "answer": "精度原理", "explanation": "根据知识点原文，先进制造工艺理论包括加工成形机理、精度原理、相似性原理和成组技术、工艺决策原理和优化原理。因此“精度原理”是正确的。干扰项中，“特种加工”属于现代制造工艺方法，错在混淆了工艺理论与加工方法；“并行工程”属于先进制造模式，错在混淆了工艺理论与制造模式；“智能制造技术”属于制造技术范畴，错在混淆了工艺理论与制造技术。", "bloom": "记忆", "model": "ali_glm/glm-5.2"}, {"id": "Q_74cda00997", "chapter": "第七章_机械制造工艺理论和技术的发展", "node": "KN_CH7_004", "type": "单选", "stem": "下列关于分层加工的叙述，正确的是：", "options": ["分层加工是将零件在某一方向按一定层厚分为若干薄层，逐一加工并依次堆积成形，是增材制造的基础", "分层加工属于变形加工，通过材料在外力作用下流动来堆积成形", "分层加工属于去除加工，通过逐层切削材料来实现零件成形", "分层加工的分层形式仅有平面分层一种"], "answer": "分层加工是将零件在某一方向按一定层厚分为若干薄层，逐一加工并依次堆积成形，是增材制造的基础", "explanation": "正确选项准确概括了分层加工的定义、过程及其与增材制造的关系。干扰项B错误地将分层加工归类为变形加工，实际上它属于结合加工；干扰项C将分层加工误认为是去除加工，忽略了其作为结合（堆积）加工的本质；干扰项D片面认为分层形式只有平面分层，忽略了知识点中明确提到的曲面分层和卷绕分层形式。", "bloom": "理解", "model": "ali_glm/glm-5.2"}, {"id": "Q_0654860c6d", "chapter": "第七章_机械制造工艺理论和技术的发展", "node": "KN_CH7_005", "type": "单选", "stem": "关于内加工方式的特点与应用，下列说法正确的是：", "options": ["内加工是在透明材料内部进行加工，加工完成后工件留在材料内部，需切开材料才能取出", "内加工是在材料外部进行加工，加工完成后可直接从外部取出工件", "内加工不能应用于透明材料，只能在不透明材料内部进行加工", "内加工是在透明材料内部进行加工，加工完成后可直接从材料中取出工件，无需切开材料"], "answer": "内加工是在透明材料内部进行加工，加工完成后工件留在材料内部，需切开材料才能取出", "explanation": "根据知识点原文，内加工是利用激光束等在透明材料内部加工工件，加工完成后工件留在材料内部，切开材料后才能取出，因此正确项描述准确。干扰项1混淆了内加工与外切削方式，误以为是在外部加工且可直接取出；干扰项2违背原文，错误认为内加工不能应用于透明材料；干扰项3虽然知道是在透明材料内部加工，但忽视了工件留在材料内部需切开取出的特点，误以为可直接取出。", "bloom": "理解", "model": "ali_glm/glm-5.2"}, {"id": "Q_edf33fa373", "chapter": "第七章_机械制造工艺理论和技术的发展", "node": "KN_CH7_006", "type": "单选", "stem": "根据机械制造工艺理论，下列哪一项不属于零件成形所使用的能源？", "options": ["力", "声", "热", "化学"], "answer": "热", "explanation": "根据知识点原文，零件成形所使用的能源有力、电、声、化学、电子、离子、激光等，并未提及'热'作为一种独立的成形能源。选项'力'、'声'、'化学'均在原文明确列出的能源范围内，分别对应超声波加工、化学加工等工艺。干扰项'力'对应学生可能认为力是常见能源但不属于成形能源的认知误区；干扰项'声'对应学生忽略声是超声波加工能源的误区；干扰项'化学'对应学生误认为化学不属于成形能源的误区。", "bloom": "记忆", "model": "ali_glm/glm-5.2"}, {"id": "Q_09749028f8", "chapter": "第七章_机械制造工艺理论和技术的发展", "node": "KN_CH7_007", "type": "单选", "stem": "在扫描探针显微加工中，若需要将材料表面的特定原子从当前位置精确移动并重新排列到另一指定位置，以实现纳米尺度的结构重组，这一操作主要属于以下哪种加工方式？", "options": ["原子搬迁和排列重组", "原子去除与增添", "雕刻加工", "扫描隧道显微加工（STM）"], "answer": "原子搬迁和排列重组", "explanation": "正确答案为“原子搬迁和排列重组”。题干明确描述了将原子从一个位置精确移动到另一个位置并重新排列，这正是原子搬迁和排列重组的核心特征。干扰项分析：1. “原子去除与增添”主要强调原子的移除或添加，虽然可能涉及移动，但题干强调的精确移动与重组更符合搬迁和排列重组的特点；2. “雕刻加工”通常涉及去除材料，而非精确移动原子，将其视为原子尺度移动属于认知误区；3. “扫描隧道显微加工（STM）”是技术名称，而非具体的加工方式，混淆了加工方式与加工技术。", "bloom": "分析", "model": "ali_glm/glm-5.2"}, {"id": "Q_db7518128d", "chapter": "第七章_机械制造工艺理论和技术的发展", "node": "KN_CH7_008", "type": "单选", "stem": "关于纳米生物加工中的生物去除成形加工与生物约束成形加工，以下分析正确的是：", "options": ["生物去除成形加工利用细菌生理特性去除材料，无需化学镀；而生物约束成形加工需通过化学镀进行约束成形，制备金属化微生物细胞以构造微结构", "生物约束成形加工仅适用于非金属材料，无法用于制备金属化微生物细胞或构造金属微结构", "生物去除成形加工需要使用化学镀来约束细菌的生长过程，以实现材料的去除成形", "生物约束成形加工的成形能力有限，无法构造形状复杂的微结构"], "answer": "生物去除成形加工利用细菌生理特性去除材料，无需化学镀；而生物约束成形加工需通过化学镀进行约束成形，制备金属化微生物细胞以构造微结构", "explanation": "正确选项准确区分了两种加工方式的核心工艺特征：生物去除成形加工利用细菌（如氧化亚铁硫杆菌）的生理特性去除纯铁、纯铜等材料，不需要化学镀；生物约束成形加工则通过控制微生物生长过程并用化学镀进行约束成形，制备金属化微生物细胞用于构造微结构。干扰项一错误地认为生物约束成形加工仅适用于非金属材料，与原文制备金属化微生物细胞相矛盾；干扰项二将两者的工艺特征混淆，把化学镀错误地归到生物去除成形加工中；干扰项三错误地认为生物约束成形加工成形能力有限，而原文并未对其形状复杂性做出限制。", "bloom": "分析", "model": "ali_glm/glm-5.2"}, {"id": "Q_2abed4b53e", "chapter": "第七章_机械制造工艺理论和技术的发展", "node": "KN_CH7_009", "type": "单选", "stem": "关于机械加工中的继承性原则与创造性原则，下列说法正确的是：", "options": ["继承性原则要求加工用的机床精度应高于所加工工件的精度，以保证加工质量和效率", "继承性原则要求加工用的机床精度应低于所加工工件的精度，以降低制造成本", "直接创造性原则是指使用高精度机床直接加工高精度工件的常规加工方式", "直接创造性原则属于间接创造性原则的一种具体应用形式"], "answer": "继承性原则要求加工用的机床精度应高于所加工工件的精度，以保证加工质量和效率", "explanation": "根据知识点原文，继承性原则（'母性'原则、循序渐进原则、'蜕化'原则）要求加工用的机床（工作母机）精度应高于所加工工件的精度，以保证加工质量和效率，故正确选项对。干扰项1错在混淆了机床精度与工件精度的关系，误以为机床精度应低于工件精度；干扰项2错在错误理解了直接创造性的含义，将其与常规高精度加工混淆，实际上直接创造性是用低精度机床借助工艺手段加工高精度工件（如'以粗干精'、'以小干大'）；干扰项3错在将直接创造性原则误归为间接创造性原则，实际上直接创造性原则与间接创造性原则是创造性原则下的两个并列分类，间接创造性原则是先用直接创造再用继承。", "bloom": "理解", "model": "ali_glm/glm-5.2"}, {"id": "Q_087a9f3355", "chapter": "第七章_机械制造工艺理论和技术的发展", "node": "KN_CH7_010", "type": "单选", "stem": "在机械加工中，某工序要求工件在夹具中定位后，其应约束的自由度未被约束。根据定位原理，这种情况属于哪种定位状态？", "options": ["欠定位", "过定位", "不完全定位", "完全定位"], "answer": "欠定位", "explanation": "根据知识点原文，欠定位是指应约束的自由度未约束，且在实际生产中是不允许的。题目明确描述了“应约束的自由度未被约束”，因此正确答案为欠定位。干扰项“过定位”对应的是同一自由度被重复约束，而非自由度未约束，属于混淆了过定位与欠定位的认知误区；干扰项“不完全定位”是指约束少于六个但满足加工要求，并非应约束的自由度未被约束，属于混淆了过定位与不完全定位的认知误区；干扰项“完全定位”是指六个自由度全部被约束，与题目描述相反，属于混淆了过定位与完全定位的认知误区。", "bloom": "理解", "model": "ali_glm/glm-5.2"}, {"id": "Q_c02ce796c7", "chapter": "第七章_机械制造工艺理论和技术的发展", "node": "KN_CH7_011", "type": "单选", "stem": "关于尺寸链原理的范畴与方法，以下哪一项表述是正确的？", "options": ["尺寸链原理建立了数学模型，针对线性尺寸链和角度尺寸链、工艺尺寸链和装配尺寸链，提出了极值法、概率法等求解方法", "尺寸链原理建立了数学模型，但仅适用于线性尺寸链和工艺尺寸链，求解只采用极值法", "尺寸链原理虽涉及线性尺寸链和角度尺寸链，但仅局限于工艺尺寸链的研究，不包含装配尺寸链", "尺寸链原理涵盖工艺尺寸链和装配尺寸链，但求解时仅提供极值法这一种方法，未涉及概率法"], "answer": "尺寸链原理建立了数学模型，针对线性尺寸链和角度尺寸链、工艺尺寸链和装配尺寸链，提出了极值法、概率法等求解方法", "explanation": "正确选项准确概括了知识点原文中关于尺寸链原理的范畴与方法：它建立了数学模型，既适用于线性尺寸链和角度尺寸链，也适用于工艺尺寸链和装配尺寸链，并提出了极值法、概率法等多种求解方法。干扰项B错在同时犯了“认为数学模型仅适用于线性尺寸链而忽略角度尺寸链”“认为只涉及工艺尺寸链而忽略装配尺寸链”以及“认为求解方法只有极值法”三个认知误区；干扰项C错在“认为尺寸链原理只涉及工艺尺寸链，而忽略了装配尺寸链等类型”的认知误区；干扰项D错在“认为尺寸链的求解方法只有极值法，忽略了概率法等其他方法”的认知误区。", "bloom": "理解", "model": "ali_glm/glm-5.2"}, {"id": "Q_2fd75a6e41", "chapter": "第七章_机械制造工艺理论和技术的发展", "node": "KN_CH7_012", "type": "单选", "stem": "在机械制造工艺理论中，质量统计分析原理常采用分布曲线法和精度曲线法（x̄—R图）等统计分析方法来分析和控制加工质量。关于这两种方法的功能，以下说法正确的是：", "options": ["分布曲线法用于判断加工误差的性质（如常值系统误差、随机误差等），精度曲线法用于实时监控加工过程质量波动", "分布曲线法不仅能判断加工误差的性质，还能在加工过程中实时监控质量波动", "应用分布曲线法等统计分析方法，可以直接消除加工过程中的常值系统误差和随机误差", "分布曲线法主要用于定量计算出加工误差的具体数值，以实现对加工质量的精确控制"], "answer": "分布曲线法用于判断加工误差的性质（如常值系统误差、随机误差等），精度曲线法用于实时监控加工过程质量波动", "explanation": "正确选项符合知识点原文的描述：分布曲线法可判断加工误差的性质（常值系统误差、随机误差等），精度曲线法（x̄—R图）可实时监控加工过程质量波动。干扰项1错在混淆了分布曲线法与精度曲线法的功能，误以为分布曲线法也能实时监控过程波动；干扰项2错在误认为统计方法能直接消除误差，实际上分布曲线法仅用于分析误差性质；干扰项3错在将分布曲线法的定性分析误解为定量计算，其实分布曲线法主要判断误差类型而非精确数值。", "bloom": "理解", "model": "ali_glm/glm-5.2"}, {"id": "Q_d8b3ca572a", "chapter": "第七章_机械制造工艺理论和技术的发展", "node": "KN_CH7_013", "type": "单选", "stem": "关于相似性原理与成组技术，下列说法中正确的是哪一个？", "options": ["相似性是成组技术的理论基础，成组工艺是成组技术的核心，而零件的分类成组方法是成组技术的关键问题", "相似性是成组技术的关键问题，成组工艺是成组技术的核心，零件的分类成组方法是成组技术的理论基础", "成组工艺是成组技术的关键问题，相似性是成组技术的核心，零件的分类成组方法是成组技术的理论基础", "提高多品种小批量生产的效率是成组技术的关键问题，相似性是成组技术的理论基础，成组工艺是成组技术的核心"], "answer": "相似性是成组技术的理论基础，成组工艺是成组技术的核心，而零件的分类成组方法是成组技术的关键问题", "explanation": "根据知识点原文，相似性是成组技术的理论基础，成组工艺是成组技术的核心，零件的分类成组方法是成组技术的关键问题。干扰项二将相似性误认为关键问题，对应“混淆理论基础与关键问题”的认知误区；干扰项三将成组工艺误认为关键问题，对应“混淆核心与关键问题”的认知误区；干扰项四将提高效率误认为关键问题，对应“混淆目的与关键问题”的认知误区。", "bloom": "理解", "model": "ali_glm/glm-5.2"}, {"id": "Q_a954c100b7", "chapter": "第七章_机械制造工艺理论和技术的发展", "node": "KN_CH7_014", "type": "单选", "stem": "关于特种加工的特点，下列说法正确的是：", "options": ["工具与工件不直接接触，无宏观切削力，且不受材料硬度限制，易于实现复杂形状加工", "工具与工件必须直接接触并依靠宏观切削力去除材料，但不受材料硬度限制", "工具与工件不直接接触，无宏观切削力，但受材料硬度限制，难以加工高硬度材料", "工具与工件不直接接触，无宏观切削力，但难以实现复杂形状的加工"], "answer": "工具与工件不直接接触，无宏观切削力，且不受材料硬度限制，易于实现复杂形状加工", "explanation": "根据知识点原文，特种加工的特点包括：①工具与工件不直接接触，无宏观切削力；②可加工任何硬度、强度、韧性的材料；③易于实现复杂形状的加工；④加工精度和表面质量高。因此正确选项全面表述了特种加工不直接接触、无宏观切削力、不受硬度限制及易于实现复杂形状加工的特点。干扰项二错在误以为特种加工需要直接接触和切削力，混淆了传统加工与特种加工；干扰项三错在误以为特种加工受材料硬度限制；干扰项四错在误以为特种加工在复杂形状加工上受限。", "bloom": "记忆", "model": "ali_glm/glm-5.2"}, {"id": "Q_8076d4d13b", "chapter": "第三章_机床夹具设计", "node": "KN_CH3_001", "type": "计算", "stem": "在连杆铣槽夹具中，定位元件采用V形块和支承板，夹紧元件采用压板。已知工件直径D=50mm，V形块夹角α=90°，压板夹紧力F=2000N，铣削时切削力Fc=1000N，工件与V形块摩擦系数μ=0.2，安全系数K=2。求夹紧时所需的最小夹紧力F_min，并判断现有夹紧力是否足够。", "options": null, "answer": "所需最小夹紧力约为14142N，现有夹紧力2000N不足。", "explanation": "根据夹紧元件的作用，需计算最小夹紧力以确保工件在加工中不移动。公式基于摩擦力平衡，考虑安全系数。", "bloom": "应用", "model": "deepseek/deepseek-chat"}, {"id": "Q_19a0381774", "chapter": "第三章_机床夹具设计", "node": "KN_CH3_002", "type": "计算", "stem": "在某机加工车间，使用一个专用夹具进行批量生产。未使用夹具时，每个工件的划线找正辅助时间为5分钟，单件加工时间为10分钟，每批工件数量为100件。使用夹具后，辅助时间减少到1分钟，单件加工时间不变，且夹具成本为2000元，人工成本为每小时30元。请计算使用该夹具后，加工100件工件节省的总时间（小时）和节省的总人工成本（元）。", "options": null, "answer": "节省总时间6.667小时，节省总人工成本200.01元", "explanation": "基于知识点中'提高生产效率，降低生产成本'的功能，通过比较使用夹具前后的辅助时间，计算节省的时间，再乘以人工成本得到节省的成本。", "bloom": "应用", "model": "deepseek/deepseek-chat"}, {"id": "Q_4fc0e0beab", "chapter": "第三章_机床夹具设计", "node": "KN_CH3_003", "type": "计算", "stem": "某机械加工车间需设计一批专用夹具用于批量生产三种不同零件（A、B、C）。已知：零件A需设计2套专用夹具，每套夹具设计成本为5000元；零件B需设计1套专用夹具，设计成本为8000元；零件C需设计3套专用夹具，每套设计成本为3000元。此外，为适应未来可能的新产品试制，车间还打算拼装3套组合夹具，每套组合夹具由标准化元件拼装，单次拼装成本（包括元件使用费）为2000元。问：该车间为这三种零件设计专用夹具和拼装组合夹具的总成本是多少？", "options": null, "answer": "33000元", "explanation": "根据知识点中专用夹具和组合夹具的定义，分别计算各零件专用夹具成本并求和，再与组合夹具成本相加得到总成本。", "bloom": "应用", "model": "deepseek/deepseek-chat"}, {"id": "Q_4d841f61de", "chapter": "第三章_机床夹具设计", "node": "KN_CH3_004", "type": "计算", "stem": "在加工一批箱体零件时，工件以底面（精基准）定位，定位元件采用4个A型支承钉。已知每个支承钉与工件的接触面积为20 mm²，定位面承受的切削力为F=1200 N，安全系数K=1.5。试计算每个支承钉承受的压应力（单位：MPa）。", "options": null, "answer": "22.5 MPa", "explanation": "先计算考虑安全系数后的总力，再分配到每个支承钉，最后用应力公式求得压应力。", "bloom": "应用", "model": "deepseek/deepseek-chat"}, {"id": "Q_6d7f1c5f9a", "chapter": "第三章_机床夹具设计", "node": "KN_CH3_005", "type": "计算", "stem": "现有一工件以圆柱孔在刚性心轴上定位，孔直径为Φ30H7（+0.021/0），心轴直径为Φ30g6（-0.007/-0.020）。试计算该定位方案的最大间隙和最小间隙，并判断工件定位后可能产生的最大径向跳动误差（假设孔与心轴中心线重合）。", "options": null, "answer": "最大间隙0.041 mm，最小间隙0.007 mm，最大径向跳动0.0205 mm", "explanation": "根据孔和心轴的极限尺寸计算间隙，径向跳动取最大间隙的一半。", "bloom": "应用", "model": "deepseek/deepseek-chat"}, {"id": "Q_729be5b3f7", "chapter": "第三章_机床夹具设计", "node": "KN_CH3_006", "type": "计算", "stem": "在工件以外圆表面定位中，使用V形块进行支承定位。已知V形块两斜面夹角α=90°，工件外圆直径D=50mm，V形块高度H=20mm，V形块标准定位高度N=30mm。试计算V形块的安装尺寸T。", "options": null, "answer": "40.35mm", "explanation": "根据已知条件α=90°，直接使用简化公式T=H+0.707D-0.5N计算安装尺寸。", "bloom": "应用", "model": "deepseek/deepseek-chat"}, {"id": "Q_981a634a23", "chapter": "第三章_机床夹具设计", "node": "KN_CH3_007", "type": "计算", "stem": "某轴类零件在车床上采用两顶尖定位，前顶尖为固定顶尖，后顶尖为活动顶尖。已知前顶尖限制3个移动自由度，后顶尖限制2个转动自由度。若该零件在加工过程中需要限制除绕自身轴线旋转外的所有自由度，请计算该定位方案限制了几个自由度，并判断是否满足加工要求。", "options": null, "answer": "限制了5个自由度，满足加工要求。", "explanation": "两顶尖定位时，前顶尖限制3个移动自由度，后顶尖限制2个转动自由度，共5个自由度。加工要求限制5个自由度，故满足。", "bloom": "应用", "model": "deepseek/deepseek-chat"}, {"id": "Q_ef83d3603e", "chapter": "第三章_机床夹具设计", "node": "KN_CH3_009", "type": "计算", "stem": "在铣床上用夹具铣削一工件上的槽，要求保证槽底至工件底面的距离为20±0.1mm。工件以底面和侧面定位，定位基准为底面，工序基准也为底面，故无基准不重合误差。定位元件为支承钉，其工作表面的高度尺寸为15±0.02mm。工件底面尺寸为30±0.05mm。试计算定位误差Δ_DW。", "options": null, "answer": "0.07mm", "explanation": "工序基准与定位基准重合，无基准不重合误差。定位误差仅由基准位置误差引起，即定位元件和工件定位面的尺寸误差在加工尺寸方向上的合成。", "bloom": "应用", "model": "deepseek/deepseek-chat"}, {"id": "Q_11653b36dc", "chapter": "第三章_机床夹具设计", "node": "KN_CH3_010", "type": "计算", "stem": "工件以φ20H7（+0.021/0）孔在φ20f6（-0.020/-0.033）定位销上定位，孔与销采用固定边接触（假设接触点位于销中心正上方）。试计算该定位方案的定位误差。", "options": null, "answer": "0.0105 mm", "explanation": "在固定边接触情况下，定位误差仅与孔径公差有关，按式3-4计算为孔径公差的一半。", "bloom": "应用", "model": "deepseek/deepseek-chat"}, {"id": "Q_c47c8bd8fd", "chapter": "第三章_机床夹具设计", "node": "KN_CH3_011", "type": "计算", "stem": "在一面两孔定位方案中，已知两定位孔直径均为Φ30H7（D₁max=D₂max=30.021mm），两定位销直径均为Φ30g6（d₁min=d₂min=29.980mm），两孔中心距L=200mm。试计算该定位方案可能产生的最大转角定位误差α。", "options": null, "answer": "0.000205 rad（或0.0117°）", "explanation": "根据一面两孔定位的转角误差公式，将两孔与两销的最大间隙之和除以两倍中心距，再取反正切得到最大转角。", "bloom": "应用", "model": "deepseek/deepseek-chat"}, {"id": "Q_7f671aaf1f", "chapter": "第三章_机床夹具设计", "node": "KN_CH3_012", "type": "计算", "stem": "在V形块上定位加工一外圆直径为φ50±0.05mm的轴，V形块夹角α=90°。试计算当工序基准为外圆下母线时，在加工尺寸方向上的定位误差。", "options": null, "answer": "0.02071mm", "explanation": "根据工序基准为外圆下母线时的定位误差公式，代入已知的直径公差和V形块半角正弦值计算得出。", "bloom": "应用", "model": "deepseek/deepseek-chat"}, {"id": "Q_6ef1162d57", "chapter": "第三章_机床夹具设计", "node": "KN_CH3_006", "type": "计算", "stem": "已知V形块定位中，H=20mm，D=100mm，α=90°，N=2，求V形块的安装尺寸T。", "options": null, "answer": "89.71mm", "explanation": "根据题目条件，使用公式T=H+0.707D-0.5N计算V形块安装尺寸T，验证公式适用性后得出结果。", "bloom": "应用", "model": "xinghuo/xop3qwen1b7"}, {"id": "Q_43522b9a6e", "chapter": "第三章_机床夹具设计", "node": "KN_CH3_009", "type": "计算", "stem": "某工件在夹具上定位时，定位表面的制造误差为Δ_JW = 0.05 mm，工序基准与定位基准不重合误差为Δ_JB = 0.1 mm，求该工件的定位误差Δ_DW。", "options": null, "answer": "0.15 mm", "explanation": "根据知识点原文，定位误差Δ_DW由基准位置误差Δ_JW和基准不重合误差Δ_JB叠加而成，计算时直接相加两个误差值。", "bloom": "应用", "model": "xinghuo/xop3qwen1b7"}, {"id": "Q_2c655869ee", "chapter": "第三章_机床夹具设计", "node": "KN_CH3_012", "type": "计算", "stem": "已知V形块定位误差公式为Δ_DW=T_d/(2sin(α/2))，当T_d=20mm，α=60°时，求定位误差Δ_DW。", "options": null, "answer": "20mm", "explanation": "根据公式Δ_DW=T_d/(2sin(α/2))，代入T_d=20mm，α=60°，计算得定位误差为20mm。", "bloom": "应用", "model": "xinghuo/xop3qwen1b7"}, {"id": "Q_6949a32526", "chapter": "第三章_机床夹具设计", "node": "KN_CH3_001", "type": "计算", "stem": "在连杆铣槽夹具中，采用一面两孔定位方式。定位平面为底面，定位销为圆柱销和菱形销。已知：工件两定位孔直径均为φ12H7（φ12+0.018/0），孔心距L=100±0.02mm。圆柱销直径d1=φ12g6（φ12-0.006/-0.017），菱形销直径d2=φ12g6（φ12-0.006/-0.017），菱形销的圆柱部分宽度b=4mm。试计算该夹具定位方案中，工件在垂直于两孔连线方向上的最大定位误差ΔD（单位为mm，保留小数点后三位）。提示：定位误差由基准位移误差和基准不重合误差组成，此处基准不重合误差为零。基准位移误差ΔY = X1max + X2max，其中X1max = D1max - d1min，X2max = D2max - d2min。", "options": null, "answer": "0.070 mm", "explanation": "本题考察一面两孔定位的定位误差计算。定位误差由基准位移误差和基准不重合误差组成，此处基准不重合误差为零。基准位移误差等于圆柱销与菱形销各自最大间隙之和，计算得0.070mm，即为定位误差。", "bloom": "应用", "model": "deepseek/deepseek-chat"}, {"id": "Q_a8b38244ff", "chapter": "第三章_机床夹具设计", "node": "KN_CH3_002", "type": "计算", "stem": "某箱体类零件需要在卧式铣镗床上镗削直径为φ100H7（+0.035/0）mm的孔，表面粗糙度Ra1.6μm。采用专用夹具（镗模）进行加工，镗杆与镗套的配合为φ60H7/g6（孔φ60H7：+0.030/0，轴φ60g6：-0.010/-0.029），配合间隙最大值0.059mm，最小值0.010mm。已知镗模导向长度为200mm，镗杆悬伸长度为100mm。试计算由于镗杆与镗套配合间隙引起的镗孔位置误差（即镗杆轴线相对于理论位置的偏移量）的最大值。", "options": null, "answer": "0.0295mm", "explanation": "镗杆与镗套配合间隙引起镗杆轴线倾斜，按几何关系，在悬伸端产生的偏移量等于间隙乘以悬伸长度与导向长度之比。取最大间隙计算得最大误差。", "bloom": "应用", "model": "deepseek/deepseek-chat"}, {"id": "Q_d0ebd4a26b", "chapter": "第三章_机床夹具设计", "node": "KN_CH3_003", "type": "计算", "stem": "在成组加工中，使用成组夹具加工一组相似零件。已知该组零件中，工件A的定位基面为平面，定位误差要求不超过0.05mm；定位元件为两个支承板，其工作面共面度公差为0.01mm。若工件A的定位基面平面度公差为0.02mm，且定位基面与夹具定位面接触良好，忽略其他误差，试计算该定位方案能否满足定位误差要求？", "options": null, "answer": "满足要求，定位误差为0.03mm", "explanation": "定位误差主要由基准位移误差引起，由工件定位基面平面度公差与定位元件共面度公差叠加得到0.03mm，小于允许的0.05mm，因此方案可行。", "bloom": "应用", "model": "deepseek/deepseek-chat"}, {"id": "Q_1849f3078e", "chapter": "第三章_机床夹具设计", "node": "KN_CH3_004", "type": "计算", "stem": "在加工一批箱体零件时，采用一面两销定位方案。其中，以底面为精基准面定位，使用两个A型支承钉（平顶）和一个B型支承板（带斜槽型）作为固定支承。已知支承钉的直径为20 mm，支承板的长度为100 mm，宽度为30 mm。工件底面为精基准面，表面粗糙度Ra=1.6 μm，定位面的平面度公差为0.05 mm。夹具上的支承钉和支承板安装后，其支承面的平面度公差为0.02 mm。试计算该定位方案中，底面定位产生的最大定位误差（即基准位移误差）。", "options": null, "answer": "0.07 mm", "explanation": "底面定位时，工序基准与定位基准重合，基准不重合误差为零。定位误差由基准位移误差引起，即工件定位面的平面度公差与夹具支承面的平面度公差之和，计算得0.07 mm。", "bloom": "应用", "model": "deepseek/deepseek-chat"}, {"id": "Q_9ea9737f44", "chapter": "第三章_机床夹具设计", "node": "KN_CH3_005", "type": "计算", "stem": "某工件以φ40H7（+0.025/0）的孔在刚性心轴上定位，心轴按g6制造，其基本尺寸为φ40mm，公差带为g6（-0.009/-0.025）。试计算该定位方案中，工件孔与心轴之间的最大间隙和最小间隙。", "options": null, "answer": "最大间隙0.050mm，最小间隙0.009mm", "explanation": "根据孔和轴的公差带，分别计算孔和轴的极限尺寸，然后相减得到最大和最小间隙。", "bloom": "应用", "model": "deepseek/deepseek-chat"}, {"id": "Q_6d6b613a96", "chapter": "第三章_机床夹具设计", "node": "KN_CH3_006", "type": "计算", "stem": "在机械加工中，使用90°V形块定位一批直径为D=50mm的外圆表面零件。已知V形块的设计高度H=20mm，V形块下部让刀槽宽度（两斜面理论交点处的开口宽度）N=30mm。试求该V形块的安装尺寸T（单位：mm，计算结果保留至小数点后两位）。", "options": null, "answer": "40.00mm", "explanation": "首先根据V形块几何关系计算出N值，然后代入α=90°时的简化公式T=H+0.707D-0.5N，计算得到T=40.00mm。", "bloom": "应用", "model": "deepseek/deepseek-chat"}, {"id": "Q_df836de8bd", "chapter": "第三章_机床夹具设计", "node": "KN_CH3_007", "type": "计算", "stem": "在齿轮磨孔工序中，采用弹性薄膜卡盘和节圆柱定位，已知节圆柱直径为φ50h6（公差带IT6，基本尺寸50mm，下偏差-0.016mm，上偏差0mm），齿轮内孔直径为φ50H7（公差带IT7，基本尺寸50mm，下偏差0mm，上偏差+0.025mm）。求定位时可能产生的最大径向定位误差（即孔与节圆柱之间的最大间隙）。", "options": null, "answer": "0.041mm", "explanation": "最大径向定位误差由孔与节圆柱之间的最大间隙决定，计算时取孔的最大尺寸和轴的最小尺寸之差。", "bloom": "应用", "model": "deepseek/deepseek-chat"}, {"id": "Q_1edd924bd2", "chapter": "第三章_机床夹具设计", "node": "KN_CH3_008", "type": "计算", "stem": "某箱体零件采用一面两孔定位，两孔直径均为D=20 mm，孔中心距L=120 mm，孔中心距公差为±0.1 mm，即T_LK=0.2 mm。圆柱销直径取20g6，其下偏差为-0.007 mm，上偏差为-0.020 mm，故圆柱销与孔的最小间隙Δ₁min=0.007 mm。两销中心距公差取孔中心距公差的1/5，即T_LX=0.04 mm。试设计菱形销，确定其宽度b和直径公称尺寸d₂（已知菱形销宽度标准值b=4 mm）。", "options": null, "answer": "菱形销宽度b=4 mm，直径公称尺寸d₂=19.9534 mm，直径公差h6（Φ19.9534_{-0.013}^{0} mm）", "explanation": "首先根据菱形销宽度公式反算最小间隙Δ₂min，然后计算菱形销直径公称尺寸，最后按h6确定公差。", "bloom": "应用", "model": "deepseek/deepseek-chat"}, {"id": "Q_853f97e6f6", "chapter": "第三章_机床夹具设计", "node": "KN_CH3_001", "type": "计算", "stem": "某连杆铣槽夹具的定位元件采用V型块，工件直径为φ50mm，公差范围为±0.025mm。已知V型块夹角α=90°，请计算该定位装置沿V形块对称面方向（垂直方向）上的最大定位误差。", "options": null, "answer": "0.0354mm", "explanation": "解题思路基于定位误差计算公式，先确定直径公差和V型块角度，代入公式分步计算水平方向误差，最后按要求保留有效数字。", "bloom": "应用", "model": "xinghuo_x2/spark-x"}, {"id": "Q_d26ae715f8", "chapter": "第三章_机床夹具设计", "node": "KN_CH3_002", "type": "计算", "stem": "某工厂采用专用机床夹具加工一批轴类零件。已知：单件生产时，每件零件的机加工时间（基本时间）为12.00分钟；使用夹具后，辅助时间由原来的8.00分钟减少至3.50分钟；准备与终结时间因夹具应用，从60.00分钟降至45.00分钟。若需完成100.00件的生产任务，请计算使用夹具后，这批零件的总单件工时T_p（单位：分钟/件）。", "options": null, "answer": "15.95 分钟/件", "explanation": "解题思路：根据机床夹具“提高生产效率”功能，其核心在于减少辅助时间等。本题通过给定使用夹具前后的基本时间、辅助时间、准备终结时间及批量，利用工程上常用的单件工时计算公式，分步计算出反映生产效率提升后的单件工时。", "bloom": "应用", "model": "xinghuo_x2/spark-x"}, {"id": "Q_acdd432809", "chapter": "第三章_机床夹具设计", "node": "KN_CH3_006", "type": "计算", "stem": "某工序以工件外圆表面在标准90° V形块上定位。已知：V形块两斜面夹角α=90°；工件外圆直径D=40.025 mm（该直径在其公称尺寸范围内）；V形块结构参数N=30.00 mm；V形块底面至其顶点的高度H=30.000 mm。试按相关公式计算该V形块的安装尺寸T。", "options": null, "answer": "43.31 mm", "explanation": "本题直接应用原文给出的90° V形块安装尺寸计算公式T=H+0.707D-0.5N，将给定的H、D、N代入，先求出精确值，再按常用精度0.01 mm进行舍入，得到推荐的安装尺寸。", "bloom": "应用", "model": "xinghuo_x2/spark-x"}, {"id": "Q_4357b7d646", "chapter": "第二章_机械加工工艺规程设计", "node": "KN_CH2_001", "type": "计算", "stem": "某机械加工车间计划新建一条生产线，用于生产某型号齿轮轴。根据机械加工工艺规程，该齿轮轴的年产量为5000件，每件需要车床加工2.5小时，铣床加工1.2小时，磨床加工0.8小时。设备年有效工作时间为250天，每天两班制，每班8小时，设备负荷率取0.85。请计算：（1）年有效工作总时数；（2）各机床所需台数（结果向上取整）。", "options": null, "answer": "年有效工作总时数：3400小时；车床：4台；铣床：2台；磨床：2台", "explanation": "根据机械加工工艺规程的作用，新建车间需依据工艺规程确定机床数量。首先计算单台设备年有效工时，再根据年产量和单件工时计算所需设备台数，结果向上取整以保证产能。", "bloom": "应用", "model": "deepseek/deepseek-chat"}, {"id": "Q_3be0e39fd4", "chapter": "第二章_机械加工工艺规程设计", "node": "KN_CH2_004", "type": "计算", "stem": "某轴类零件在加工过程中需确定某工序的加工余量及工序尺寸。已知：该轴最终尺寸为φ50h7（φ50-0.025），毛坯为锻件，直径余量为6mm。粗车工序后尺寸为φ52.5mm，半精车工序后尺寸为φ50.3mm。计算：①粗车工序的加工余量；②半精车工序的加工余量；③精车工序的加工余量及工序尺寸（精车后达到最终尺寸）。", "options": null, "answer": "粗车余量3.5mm，半精车余量2.2mm，精车余量0.3mm，精车工序尺寸为φ50-0.025mm", "explanation": "根据机械加工工艺规程中确定加工余量和工序尺寸的方法，从毛坯到最终尺寸逐步计算各工序余量，并确定精车工序尺寸为最终尺寸。", "bloom": "应用", "model": "deepseek/deepseek-chat"}, {"id": "Q_782f170b56", "chapter": "第二章_机械加工工艺规程设计", "node": "KN_CH2_005", "type": "计算", "stem": "某箱体零件上有两个平行孔，孔中心距为100±0.05mm。现采用镗模加工，镗杆导套的磨损导致孔中心距实际偏差服从正态分布，标准差σ=0.02mm。要求计算：1）该工序的工艺能力指数Cp；2）估计不合格品率（已知Φ(2.5)=0.9938）。", "options": null, "answer": "Cp≈0.83，不合格品率≈1.24%", "explanation": "根据工艺能力指数公式Cp=T/(6σ)计算Cp值，再根据正态分布性质计算不合格品率。", "bloom": "应用", "model": "deepseek/deepseek-chat"}, {"id": "Q_cf0b4f44f9", "chapter": "第二章_机械加工工艺规程设计", "node": "KN_CH2_006", "type": "计算", "stem": "某箱体零件加工时，首先以底面A为粗基准加工顶面B。已知底面A的毛坯表面平面度误差为0.5mm，顶面B的加工余量要求为3mm。若粗基准重复使用一次，定位误差增加0.3mm。现需保证顶面B的最终加工余量不小于2.5mm。试确定：第一次加工顶面B时，毛坯余量的最小值应为多少？", "options": null, "answer": "3.3mm", "explanation": "根据粗基准选择原则，粗基准不能重复使用，重复使用会引入定位误差。为保证最终加工余量，需将毛坯余量设定为最终余量、平面度误差与定位误差之和。", "bloom": "应用", "model": "deepseek/deepseek-chat"}, {"id": "Q_375402c404", "chapter": "第二章_机械加工工艺规程设计", "node": "KN_CH2_007", "type": "计算", "stem": "某轴类零件，其设计尺寸为直径Φ100h6（上偏差0，下偏差-0.022mm）。在加工过程中，选择精基准为外圆表面，但该精基准与设计基准不重合，导致基准不重合误差。已知定位基准与设计基准之间的尺寸链中，组成环的尺寸为：基准转换尺寸L=50±0.01mm。试计算基准不重合误差Δ，并判断该误差是否会影响零件加工精度（要求加工误差小于零件公差的三分之一）。", "options": null, "answer": "基准不重合误差Δ=0.02mm，大于零件公差的三分之一（0.00733mm），会影响加工精度。", "explanation": "根据基准重合原则，精基准应选择设计基准，否则会产生基准不重合误差。本题中，定位基准与设计基准不重合，通过尺寸链计算得到基准不重合误差为组成环公差0.02mm。将该误差与零件公差的三分之一比较，发现误差过大，因此需要重新选择精基准。", "bloom": "应用", "model": "deepseek/deepseek-chat"}, {"id": "Q_a9b6c19c5b", "chapter": "第二章_机械加工工艺规程设计", "node": "KN_CH2_008", "type": "计算", "stem": "某厂需加工一批φ50mm外圆、材料为45钢的轴，要求加工精度IT6，表面粗糙度Ra0.8μm。现工厂有普通车床、精车、粗磨和精磨四种加工方法，其加工经济精度分别为：普通车床IT8~IT7、Ra3.2~1.6μm；精车IT7~IT6、Ra1.6~0.8μm；粗磨IT8~IT7、Ra1.6~0.4μm；精磨IT6~IT5、Ra0.4~0.2μm。若加工成本与加工误差成反比，且已知精磨的相对成本为1，精车的相对成本为0.6，粗磨的相对成本为0.4，普通车床的相对成本为0.2。试选择最经济的加工方法，并计算其相对成本。", "options": null, "answer": "精车，相对成本0.6", "explanation": "首先根据加工精度和表面粗糙度要求，从给定加工方法的经济精度中筛选出能同时满足IT6和Ra0.8μm的方法，即精车和精磨。然后比较两者的相对成本，选择成本较低的加工方法。", "bloom": "应用", "model": "deepseek/deepseek-chat"}, {"id": "Q_33808e7bf4", "chapter": "第二章_机械加工工艺规程设计", "node": "KN_CH2_009", "type": "计算", "stem": "某轴类零件材料为45钢，未淬火，要求加工后外圆直径公差IT7，表面粗糙度Ra=0.8μm。现有毛坯直径为φ50mm，需加工至φ40mm。请确定合理的加工路线，并计算粗车、半精车、精车各工序的切削深度（假设各工序余量分配为：粗车余量占总余量的60%，半精车占25%，精车占15%）。", "options": null, "answer": "粗车切削深度3 mm，半精车切削深度1.25 mm，精车切削深度0.75 mm", "explanation": "首先根据工件材料、精度和粗糙度要求选择加工路线，然后计算总余量，再按给定比例分配各工序余量，切削深度即为单边余量。", "bloom": "应用", "model": "deepseek/deepseek-chat"}, {"id": "Q_d971a618b4", "chapter": "第二章_机械加工工艺规程设计", "node": "KN_CH2_002", "type": "单选", "stem": "下列关于机械加工工艺规程格式的说法，正确的是？", "options": ["单件小批生产只需填写机械加工工艺过程卡片", "所有生产类型均需填写机械加工工序卡片", "数控工序仅需在调整卡中注明", "检验工序无需专门卡片"], "answer": "单件小批生产只需填写机械加工工艺过程卡片", "explanation": "解析：正确项准确反映了原文中单件小批生产的格式要求。干扰项B错误地扩大了工序卡片适用范围，忽视了生产类型的差异；干扰项C混淆了数控工序的专用文件要求，将其降级为普通调整卡；干扰项D否定了检验卡的必要性，违反了原文明确规定。", "bloom": "记忆", "model": "xinghuo_x2/spark-x"}, {"id": "Q_def75ffd3e", "chapter": "第二章_机械加工工艺规程设计", "node": "KN_CH2_003", "type": "单选", "stem": "下列关于机械加工工艺规程设计原则的表述，正确的是？", "options": ["当发现图样技术要求不当时，可直接修改以优化工艺。", "必须优先保证生产纲领，即使牺牲部分技术要求。", "在满足技术要求和生产纲领要求的前提下，一般要求工艺成本最低。", "工人劳动强度可暂不考虑，只要生产效率高即可。"], "answer": "在满足技术要求和生产纲领要求的前提下，一般要求工艺成本最低。", "explanation": "正确项C准确反映了原则③，即在满足技术和生产要求后，追求工艺成本最低。干扰项A错误，因为它允许擅自修改图样，违反了原则①；干扰项B错误，因为它优先考虑生产纲领而牺牲技术要求，违背了原则②；干扰项D错误，因为它忽略了减轻劳动强度和确保安全的原则④。", "bloom": "理解", "model": "xinghuo_x2/spark-x"}, {"id": "Q_ebe925a135", "chapter": "第二章_机械加工工艺规程设计", "node": "KN_CH2_005", "type": "单选", "stem": "下列关于零件结构工艺性概念的说法，哪一项是正确的？", "options": ["在满足使用要求的前提下，制造该零件的可行性和经济性。", "零件的设计应优先保证其外观美观以提升市场吸引力。", "使用高强度材料来增强零件的耐用性。", "采用复杂的加工工艺以实现最高的精度标准。"], "answer": "在满足使用要求的前提下，制造该零件的可行性和经济性。", "explanation": "正确项准确反映了知识点原文对零件结构工艺性的定义，即在满足使用要求下兼顾制造可行性和经济性。干扰项B的错误在于学生可能将工艺性误解为外观设计；干扰项C的错误在于学生可能将工艺性与材料性能混淆；干扰项D的错误在于学生可能高估复杂工艺的作用，而忽略了工艺性对低成本和易制造的重视。", "bloom": "理解", "model": "xinghuo_x2/spark-x"}, {"id": "Q_3ed7fd4157", "chapter": "第二章_机械加工工艺规程设计", "node": "KN_CH2_006", "type": "单选", "stem": "关于粗基准选择的原则，下列说法正确的是？", "options": ["当需要保证工件上加工面与不加工面的相互位置要求时，应以不加工面作为粗基准。", "若必须首先保证某重要加工面的余量均匀，则应以该加工面的已加工表面作为粗基准。", "为了保证重要加工面的余量均匀，应优先选择不加工面作为粗基准。", "粗基准可以多次重复使用，只要每次装夹前清理干净即可。"], "answer": "当需要保证工件上加工面与不加工面的相互位置要求时，应以不加工面作为粗基准。", "explanation": "正确项准确体现了“保证相互位置要求”时应以不加工面作粗基准的原则。B项错在把“毛坯面”误解为“已加工表面”，落入粗/精基准混淆的误区；C项错在将“余量均匀”的目标错误地匹配到“不加工面”上，属于条件-方法错位；D项错在允许重复使用粗基准，忽视了重复使用会显著增大定位误差的风险。", "bloom": "理解", "model": "xinghuo_x2/spark-x"}, {"id": "Q_5111af9ab8", "chapter": "第二章_机械加工工艺规程设计", "node": "KN_CH2_007", "type": "单选", "stem": "在机械加工中，当若干个表面之间的位置度要求非常高时，通常会采用两个相关表面交替作为定位基准进行反复加工。这种做法主要体现了精基准选择中的哪一条原则？", "options": ["互为基准原则", "基准重合原则", "统一基准原则", "自为基准原则"], "answer": "互为基准原则", "explanation": "题干描述‘两个相关表面交替作为定位基准反复加工’，与原文对‘互为基准原则’的定义完全一致，因此正确。B项‘基准重合’强调设计基准与定位基准一致，题干并未体现‘重合’；C项‘统一基准’强调长期使用同一个精基准，与‘交替’相反；D项‘自为基准’主要用于减粗糙度/均余量，且常以加工面自身为基准，并非为了解决高位置度的相互基准问题。", "bloom": "理解", "model": "xinghuo_x2/spark-x"}, {"id": "Q_199c2bd6e7", "chapter": "第二章_机械加工工艺规程设计", "node": "KN_CH2_009", "type": "单选", "stem": "某钢铁零件经淬火处理，外圆最终技术要求为IT6级公差、表面粗糙度Ra=0.20μm。下列哪条加工路线是正确的？", "options": ["粗车—半精车—精车—金刚石车", "粗车—半精车—粗磨—精磨", "粗车—半精车—粗磨—精磨—砂带磨/抛光等超精加工", "粗车—半精车—精车"], "answer": "粗车—半精车—粗磨—精磨", "explanation": "解析：题干为“钢铁材料+淬火后+IT6/Ra=0.20μm”，与原文第②条“粗车—半精车—粗磨—精磨，适用于钢铁材料、淬火后、IT≤6、Ra≥0.16μm”完全匹配，故该项正确。干扰项A错在将“非铁金属不宜磨削时采用金刚石车”错误迁移到钢铁淬火件；干扰项C错在对已达目标精度的表面继续安排超精加工，造成不必要的工序；干扰项D错在对淬火后钢铁件仍只用车削而不磨削，无法稳定达到IT6/Ra0.20。", "bloom": "应用", "model": "xinghuo_x2/spark-x"}, {"id": "Q_8c631c5d46", "chapter": "第二章_机械加工工艺规程设计", "node": "KN_CH2_010", "type": "单选", "stem": "在单件小批生产中，加工位置精度要求高的箱体孔系时，应优先选择哪种加工路线？", "options": ["钻—粗拉—精拉", "钻—扩—铰—手铰", "钻/粗镗—半精镗—精镗—浮动镗/金刚镗", "钻/粗镗—半精镗—粗磨—精磨—研磨/珩磨"], "answer": "钻/粗镗—半精镗—精镗—浮动镗/金刚镗", "explanation": "正确项'钻/粗镗—半精镗—精镗—浮动镗/金刚镗'适用于单件小批生产中的高位置精度孔系，因其通过镗削过程逐步控制位置精度。干扰项'钻—粗拉—精拉'错在只适用于大批大量生产，学生易忽略生产类型限制；'钻—扩—铰—手铰'错在无法纠正位置精度，学生常误以为铰孔能提升所有精度；'钻/粗镗—半精镗—粗磨—精磨—研磨/珩磨'错在主要用于淬硬零件，学生可能混淆精度类型，误用于非淬硬场景。", "bloom": "应用", "model": "xinghuo_x2/spark-x"}, {"id": "Q_c844438d57", "chapter": "第二章_机械加工工艺规程设计", "node": "KN_CH2_001", "type": "计算", "stem": "某机械加工车间计划根据工艺规程要求进行设备配置。已知该车间需加工一种轴类零件，年产量为5000件，单件加工时间为30分钟，设备利用率要求为85%，车间采用两班制生产，每班工作8小时，年工作日为250天。请计算该车间所需配置的机床数量（取整数）。", "options": null, "answer": "1台", "explanation": "首先根据生产班制、设备利用率等计算年有效工作时间，再根据年产量和单件工时计算所需总工时，两者相除得到理论机床数，最后向上取整得到实际所需的机床数量。", "bloom": "应用", "model": "deepseek/deepseek-chat"}, {"id": "Q_f334120803", "chapter": "第二章_机械加工工艺规程设计", "node": "KN_CH2_002", "type": "计算", "stem": "某机械加工车间需为一种轴类零件编制工艺规程。该零件为单件小批生产，设计精度为IT7级，工艺过程为常规车削和磨削，无数控工序。已知该零件的年产量为50件，试问：根据机械加工工艺规程的格式要求，该车间应填写哪种类型的工艺卡片？并说明理由。", "options": null, "answer": "应填写机械加工工艺过程卡片。", "explanation": "根据知识点原文，单件小批生产只需填写机械加工工艺过程卡片。已知年产量50件，属于单件小批，且无数控工序，故只需工艺过程卡片。", "bloom": "应用", "model": "deepseek/deepseek-chat"}, {"id": "Q_dbead27d78", "chapter": "第二章_机械加工工艺规程设计", "node": "KN_CH2_003", "type": "计算", "stem": "某零件生产纲领为年产5000件，采用机械加工工艺规程设计。已知该零件在车床上的单件工序时间为：粗车外圆12分钟，精车外圆15分钟，去毛刺3分钟。若年工作天数为250天，每天工作8小时，设备利用率按80%计算，试计算完成该生产纲领所需的车床台数（取整数）。", "options": null, "answer": "2台", "explanation": "首先计算单件总时间，然后根据年产量计算年总工时，再计算单台设备年有效工作时间，最后用年总工时除以单台有效时间得到所需台数，向上取整。", "bloom": "应用", "model": "deepseek/deepseek-chat"}, {"id": "Q_b69347af3d", "chapter": "第二章_机械加工工艺规程设计", "node": "KN_CH2_004", "type": "计算", "stem": "某轴类零件在车床上进行外圆精车工序，已知毛坯直径为φ50mm，精车后直径为φ45mm，长度为200mm。采用高速钢车刀，切削速度v=30m/min，进给量f=0.15mm/r，背吃刀量a_p=2.5mm。试计算该工序的基本时间（机动时间）。", "options": null, "answer": "6.283 min", "explanation": "首先根据切削速度公式计算工件转速，然后确定走刀次数（背吃刀量等于单边余量，一次走刀），最后利用基本时间公式计算得到机动时间。", "bloom": "应用", "model": "deepseek/deepseek-chat"}, {"id": "Q_48c154152e", "chapter": "第二章_机械加工工艺规程设计", "node": "KN_CH2_005", "type": "计算", "stem": "在批量生产某箱体零件时，需加工一个直径为30H7（+0.021/0）的孔，孔中心距箱壁距离为12mm。由于孔离箱壁太近，标准钻头无法直接钻孔，需设计专用加长钻头。已知钻头材料为高速钢，钻头直径d=30mm，顶角2φ=118°，钻孔时切削速度v=20m/min，进给量f=0.15mm/r，孔深L=40mm，钻头工作部分需在孔深基础上预留5mm的排屑与导向附加长度。试计算：1）钻头钻尖高度h；2）专用加长钻头工作部分的最小长度。", "options": null, "answer": "钻头总长至少为195mm", "explanation": "首先根据钻头几何参数计算钻尖高度，确定标准钻头工作部分最小长度；然后根据孔深和附加长度计算实际所需工作部分长度；最后加上柄部长度得到总长。", "bloom": "应用", "model": "deepseek/deepseek-chat"}, {"id": "Q_f1d0be5980", "chapter": "第二章_机械加工工艺规程设计", "node": "KN_CH2_006", "type": "计算", "stem": "某箱体零件第一道工序需要以粗基准定位加工底面。毛坯底面（不加工面）与顶面（加工面）有位置度要求，且顶面加工余量需均匀。已知毛坯顶面在粗基准定位下的平行度误差为0.15 mm，粗基准允许的定位误差为0.05 mm。若采用一次定位加工，试计算该工序能否保证顶面加工余量均匀（要求余量不均度≤0.10 mm）？若不能，应如何改进？", "options": null, "answer": "不能保证，因为余量不均度0.20 mm > 0.10 mm。改进：以顶面毛坯面为粗基准。", "explanation": "首先计算以底面为粗基准时的平行度误差，判断是否满足余量均匀要求；若不满足，则根据粗基准选择原则②改用顶面毛坯面为粗基准。", "bloom": "应用", "model": "deepseek/deepseek-chat"}, {"id": "Q_c372b3e255", "chapter": "第二章_机械加工工艺规程设计", "node": "KN_CH2_007", "type": "计算", "stem": "某轴类零件，其设计基准为左端面A，加工过程中要求保证尺寸50±0.1mm。现采用精基准为右端面B，左端面A与右端面B之间的尺寸为100±0.05mm。若以右端面B为定位基准加工左端面，试计算基准不重合误差，并判断能否满足尺寸50±0.1mm的公差要求。已知定位误差为0.02mm，夹具制造误差为0.01mm。", "options": null, "answer": "基准不重合误差为0.1mm，总加工误差为0.13mm，小于工件公差0.2mm，因此可以满足尺寸50±0.1mm的公差要求。", "explanation": "首先计算基准不重合误差，即定位基准与设计基准之间的尺寸公差；然后结合给定的定位误差和夹具制造误差，计算总加工误差；最后与工件公差比较，判断是否满足要求。", "bloom": "应用", "model": "deepseek/deepseek-chat"}, {"id": "Q_054f911ab0", "chapter": "第二章_机械加工工艺规程设计", "node": "KN_CH2_008", "type": "计算", "stem": "某轴类零件的外圆直径为φ50mm，材料为45钢，要求加工精度为IT6，表面粗糙度为Ra0.8μm。工厂现有普通车床（经济精度IT8~IT7，Ra1.6~3.2μm）、外圆磨床（经济精度IT6~IT5，Ra0.4~0.8μm）和数控车床（经济精度IT7~IT6，Ra0.8~1.6μm）。根据加工经济精度原则，选择最合适的加工方法，并说明理由。若采用外圆磨床加工，已知磨削余量为0.5mm，砂轮直径为400mm，工件转速为200r/min，磨削深度为0.01mm，计算完成该工序所需的磨削时间（假设磨削行程次数等于余量除以磨削深度，且每行程工作台纵向进给量为0.5倍砂轮宽度，砂轮宽度为50mm，工作台单行程长度取工件长度加20mm，工件长度为200mm）。", "options": null, "answer": "2.2 min", "explanation": "首先根据加工经济精度选择外圆磨床，然后计算磨削行程次数（余量除以磨削深度），再计算工作台单行程长度，接着计算纵向进给量（0.5倍砂轮宽度），然后计算工件每转时间和每次行程时间，最后乘以行程次数得到总磨削时间。", "bloom": "应用", "model": "deepseek/deepseek-chat"}, {"id": "Q_75de8765f0", "chapter": "第二章_机械加工工艺规程设计", "node": "KN_CH2_009", "type": "计算", "stem": "某轴类零件材料为45钢，未淬火，要求加工后达到IT6精度，表面粗糙度Ra≤0.2μm。现有外圆表面加工路线：粗车→半精车→粗磨→精磨。已知粗车后直径余量为4mm，半精车后直径余量为1.2mm，粗磨后直径余量为0.4mm，精磨后直径余量为0.1mm。若毛坯直径为φ50mm，试计算精磨后轴的最终直径。", "options": null, "answer": "44.3mm", "explanation": "根据加工路线，逐步减去各工序余量，得到最终直径。粗车后直径46mm，半精车后44.8mm，粗磨后44.4mm，精磨后44.3mm。", "bloom": "应用", "model": "deepseek/deepseek-chat"}, {"id": "Q_e03d437054", "chapter": "第二章_机械加工工艺规程设计", "node": "KN_CH2_010", "type": "计算", "stem": "某箱体零件有一批精密孔需要加工，孔径设计为φ80H7（公差等级IT7，公差带0.030mm），孔的长度为100mm，材料为淬硬钢（硬度HRC50）。现采用“钻—半精镗—粗磨—精磨—珩磨”的加工路线。已知：钻削后孔径为φ78.0mm；半精镗后孔径为φ79.6mm；粗磨后孔径为φ79.90mm；精磨后孔径为φ79.98mm；珩磨余量为0.02mm（直径上）。试计算：半精镗、粗磨、精磨各工序的加工余量（直径上，单位mm）。", "options": null, "answer": "半精镗余量1.6mm，粗磨余量0.3000mm，精磨余量0.0800mm", "explanation": "根据加工余量的定义，各工序余量等于本工序加工后的孔径减去本工序加工前的孔径。依次计算半精镗、粗磨、精磨的余量，并验证珩磨余量与给定值一致。", "bloom": "应用", "model": "deepseek/deepseek-chat"}, {"id": "Q_d11c75b256", "chapter": "第五章_机械加工表面质量及其控制", "node": "KN_001", "type": "单选", "stem": "机械加工表面质量对产品的影响主要体现在哪个方面？", "options": ["零件的破坏通常从表面层开始", "零件的破坏通常从内部开始", "表面质量只影响外观，不影响使用寿命", "表面质量与工艺因素无关"], "answer": "零件的破坏通常从表面层开始", "explanation": "根据知识点原文，机械零件的破坏一般都是从表面层开始的，这说明表面质量至关重要。选项A正确。选项B错误，因为原文明确指出破坏从表面层开始。选项C错误，表面质量对使用寿命有很大影响。选项D错误，原文指出工艺因素对表面质量有影响规律。", "bloom": "记忆", "model": "deepseek/deepseek-chat"}, {"id": "Q_9cf1d8b372", "chapter": "第五章_机械加工表面质量及其控制", "node": "KN_002", "type": "单选", "stem": "加工表面质量包括哪两个方面的内容？", "options": ["加工表面的几何形貌和表面层材料的力学物理性能和化学性能", "加工表面的粗糙度和加工硬化", "加工表面的波纹度和表面层材料的金相组织变化", "加工表面的纹理方向和表面层材料的残余应力"], "answer": "加工表面的几何形貌和表面层材料的力学物理性能和化学性能", "explanation": "正确答案为加工表面的几何形貌和表面层材料的力学物理性能和化学性能，这是加工表面质量概念的核心内容。干扰项A片面地只提到粗糙度和加工硬化，忽略了其他几何形貌特征（如波纹度、纹理）和力学物理化学性能（如残余应力、显微硬度等）；干扰项B只提到波纹度和金相组织变化，同样不完整；干扰项C只提到纹理方向和残余应力，也不全面。这些干扰项均源于对加工表面质量概念记忆不准确、以偏概全的认知误区。", "bloom": "记忆", "model": "deepseek/deepseek-chat"}, {"id": "Q_bbd56cb8f3", "chapter": "第五章_机械加工表面质量及其控制", "node": "KN_003", "type": "单选", "stem": "加工表面的几何形貌不包括以下哪一项？", "options": ["表面粗糙度", "表面波纹度", "表面硬度", "纹理方向"], "answer": "表面硬度", "explanation": "加工表面几何形貌包括表面粗糙度、表面波纹度、纹理方向和表面缺陷，而表面硬度属于材料力学性能，不属于几何形貌范畴。干扰项中，表面粗糙度、表面波纹度和纹理方向都是几何形貌的组成部分，学生可能因混淆概念而误选。", "bloom": "记忆", "model": "deepseek/deepseek-chat"}, {"id": "Q_221159cc8f", "chapter": "第五章_机械加工表面质量及其控制", "node": "KN_004", "type": "单选", "stem": "在机械加工过程中，表层金属的力学物理和化学性能发生变化，以下哪项不属于这些变化？", "options": ["表层金属的冷作硬化", "表层金属的金相组织变化", "表层金属的残余应力", "表层金属的化学成分改变"], "answer": "表层金属的化学成分改变", "explanation": "根据知识点原文，加工表层金属的力学物理性能和化学性能变化主要反映在三个方面：冷作硬化、金相组织变化和残余应力，并不包括化学成分改变。因此D选项不属于这些变化。A、B、C三个选项都是原文明确指出的变化，故为错误选项。", "bloom": "理解", "model": "deepseek/deepseek-chat"}, {"id": "Q_d2d5432459", "chapter": "第五章_机械加工表面质量及其控制", "node": "KN_005", "type": "单选", "stem": "根据知识点原文，关于表面粗糙度与耐磨性的关系，以下哪项描述是正确的？", "options": ["表面粗糙度值越小，耐磨性越好，不存在最优值", "表面粗糙度值越小，耐磨性越差，因为润滑液难以储存", "存在最优表面粗糙度值，过大或过小都会使磨损增加", "表面粗糙度与耐磨性无关，主要取决于材料硬度"], "answer": "存在最优表面粗糙度值，过大或过小都会使磨损增加", "explanation": "正确答案为C。知识点原文明确指出：表面粗糙度值越小，耐磨性越好，但存在最优表面粗糙度值。表面粗糙度值太小会导致分子粘接和润滑液不易储存，磨损反而增加；粗糙度值过大则起始磨损量大。因此存在最优值。选项A忽略了最优值；选项B只强调粗糙度小的缺点，未考虑粗糙度大的影响；选项D完全忽略表面粗糙度的影响，与原文不符。", "bloom": "理解", "model": "deepseek/deepseek-chat"}, {"id": "Q_0bce46b466", "chapter": "第五章_机械加工表面质量及其控制", "node": "KN_006", "type": "单选", "stem": "根据表面纹理对耐磨性的影响，以下哪种说法是正确的？", "options": ["圆弧状、凹坑状表面纹理的耐磨性较好", "尖峰状表面纹理的耐磨性最好", "两相对运动零件表面刀纹方向均与运动方向垂直时耐磨性最好", "重载工况下表面纹理对耐磨性的影响规律与轻载相同"], "answer": "圆弧状、凹坑状表面纹理的耐磨性较好", "explanation": "根据知识点，圆弧状、凹坑状表面纹理耐磨性好，尖峰状差；刀纹方向均与运动方向相同时耐磨性较好，垂直时最差；重载工况下规律可能不同。因此A正确。B误以为尖峰状耐磨最好，实际尖峰易磨损；C误以为垂直方向耐磨最好，实际最差；D忽略了重载工况下规律可能不同的说明。", "bloom": "理解", "model": "deepseek/deepseek-chat"}, {"id": "Q_5b0e86f8de", "chapter": "第五章_机械加工表面质量及其控制", "node": "KN_007", "type": "单选", "stem": "根据冷作硬化对耐磨性影响的分析，以下哪项描述是正确的？", "options": ["冷作硬化程度越高，耐磨性越好", "冷作硬化对耐磨性没有显著影响", "冷作硬化存在最佳程度，过度硬化反而加速磨损", "冷作硬化总是降低耐磨性"], "answer": "冷作硬化存在最佳程度，过度硬化反而加速磨损", "explanation": "正确答案为C。根据知识点原文，冷作硬化一般能提高耐磨性，但存在最佳硬化程度，以T7A钢为例，硬度达380HBW左右时耐磨性最佳；过度硬化会引起金属组织疏松、产生剥落，加速磨损。选项A错误，因为并非越高越好，过度硬化会加速磨损；选项B错误，冷作硬化对耐磨性有显著影响；选项D错误，冷作硬化一般能提高耐磨性，并非总是降低。", "bloom": "理解", "model": "deepseek/deepseek-chat"}, {"id": "Q_a38f2590cd", "chapter": "第五章_机械加工表面质量及其控制", "node": "KN_008", "type": "单选", "stem": "关于表面粗糙度对疲劳强度的影响，以下说法正确的是？", "options": ["表面粗糙度值越小，疲劳强度越好", "铸铁对表面粗糙度引起的应力集中最为敏感", "表面粗糙度值越大，疲劳强度越好", "非铁金属对表面粗糙度引起的应力集中最为敏感"], "answer": "表面粗糙度值越小，疲劳强度越好", "explanation": "根据知识点原文，表面粗糙度值越小，表面缺陷越少，疲劳强度越好。钢材对应力集中最敏感，而铸铁和非铁金属敏感性较弱。选项B、D颠倒了敏感性顺序，选项C则与原文相反。", "bloom": "理解", "model": "deepseek/deepseek-chat"}, {"id": "Q_525cd52e14", "chapter": "第五章_机械加工表面质量及其控制", "node": "KN_009", "type": "单选", "stem": "关于表层金属性质对疲劳强度的影响，以下说法正确的是？", "options": ["冷作硬化阻止疲劳裂纹生长，提高疲劳强度", "冷作硬化促进疲劳裂纹生长，降低疲劳强度", "拉伸残余应力提高疲劳强度", "压缩残余应力降低疲劳强度"], "answer": "冷作硬化阻止疲劳裂纹生长，提高疲劳强度", "explanation": "根据原文，冷作硬化能够阻止疲劳裂纹生长，提高疲劳强度，因此选项A正确。选项B错误，因为冷作硬化是阻止而非促进裂纹生长；选项C错误，因为拉伸残余应力使疲劳强度下降；选项D错误，因为压缩残余应力使疲劳强度提高。", "bloom": "理解", "model": "deepseek/deepseek-chat"}, {"id": "Q_5d53937c7d", "chapter": "第五章_机械加工表面质量及其控制", "node": "KN_010", "type": "单选", "stem": "关于表面质量对零件耐蚀性的影响，以下说法正确的是？", "options": ["表面粗糙度值越小，耐蚀性越好", "表面粗糙度值越大，耐蚀性越好", "表面残余压应力会降低耐蚀性", "表面粗糙度与耐蚀性无关"], "answer": "表面粗糙度值越小，耐蚀性越好", "explanation": "根据知识点，表面粗糙度值越小，接触面积小，腐蚀物质不易沉积，耐蚀性好；反之粗糙度大则耐蚀性差。另外，残余压应力能阻止裂纹扩展，有利于提高耐蚀性。选项B错误，粗糙度大耐蚀性差；选项C错误，压应力提高耐蚀性；选项D错误，粗糙度与耐蚀性相关。", "bloom": "理解", "model": "deepseek/deepseek-chat"}, {"id": "Q_ba5977e08f", "chapter": "第五章_机械加工表面质量及其控制", "node": "KN_011", "type": "单选", "stem": "表面粗糙度对间隙配合和过盈配合的影响有何不同？", "options": ["对间隙配合，表面粗糙度值越大，起始磨损越大，间隙变化越大，影响配合稳定性；对过盈配合，表面粗糙度值越大，凸峰易被挤掉，使过盈量减少", "对间隙配合，表面粗糙度值越大，起始磨损越小，间隙变化越小，配合稳定性越好；对过盈配合，表面粗糙度值越大，凸峰越不易被挤掉，过盈量增加", "对间隙配合，表面粗糙度值越大，起始磨损越小，间隙变化越小；对过盈配合，表面粗糙度值越大，凸峰越易被挤掉，过盈量增加", "表面粗糙度对间隙配合和过盈配合的影响完全相同，都是使配合变松"], "answer": "对间隙配合，表面粗糙度值越大，起始磨损越大，间隙变化越大，影响配合稳定性；对过盈配合，表面粗糙度值越大，凸峰易被挤掉，使过盈量减少", "explanation": "根据知识点原文，对于间隙配合，起始磨损量与表面粗糙度的平均高度成正比，粗糙度值越大，原有间隙变化量越大，影响配合稳定性；对于过盈配合，粗糙度值越大，凸峰易被挤掉，使过盈量减少。选项A正确。选项B错误地认为粗糙度大有利于间隙配合稳定性，且过盈配合凸峰不易被挤掉。选项C错误地认为间隙配合起始磨损小。选项D错误地认为两种影响相同。", "bloom": "理解", "model": "deepseek/deepseek-chat"}, {"id": "Q_a09ae68fa3", "chapter": "第五章_机械加工表面质量及其控制", "node": "KN_012", "type": "计算", "stem": "在车削加工中，采用尖刀车削，已知刀具主偏角κ_r=45°，副偏角κ_r'=15°，进给量f=0.2 mm/r。试计算残留面积高度H。", "options": null, "answer": "0.0423 mm", "explanation": "根据尖刀切削残留面积高度公式H = f/(cotκ_r + cotκ_r')，代入给定的主偏角、副偏角和进给量计算得到。", "bloom": "应用", "model": "deepseek/deepseek-chat"}, {"id": "Q_d4f1f6c9a4", "chapter": "第五章_机械加工表面质量及其控制", "node": "KN_013", "type": "单选", "stem": "在加工弹塑性材料时，切削速度对表面粗糙度的影响表现为：", "options": ["当切削速度v为20~50m/min时，表面粗糙度值最大，因为此时容易出现积屑瘤", "切削速度越高，表面粗糙度值越小", "加工弹塑性材料时，切削速度对表面粗糙度影响不大", "当切削速度v超过100m/min时，表面粗糙度值会继续下降并趋于零"], "answer": "当切削速度v为20~50m/min时，表面粗糙度值最大，因为此时容易出现积屑瘤", "explanation": "根据知识点，加工弹塑性材料时，切削速度在20~50m/min时因积屑瘤导致表面粗糙度值最大；超过100m/min后粗糙度下降并趋于稳定，并非单调递减或影响不大。选项A正确；选项B忽略了低速区的峰值；选项C误将弹塑性材料当作脆性材料；选项D夸大了高速切削的效果。", "bloom": "理解", "model": "deepseek/deepseek-chat"}, {"id": "Q_d9a98a40b8", "chapter": "第五章_机械加工表面质量及其控制", "node": "KN_014", "type": "单选", "stem": "为减小切削加工后的表面粗糙度值，以下哪种措施是有效的？", "options": ["精加工前进行调质处理", "增大进给量", "减小刀具前角", "降低刀具刃磨质量"], "answer": "精加工前进行调质处理", "explanation": "根据知识点，精加工前进行调质处理可获得均匀细密的晶粒组织和较高硬度，从而减小表面粗糙度值。增大进给量会增大粗糙度，减小刀具前角不利于减小粗糙度，降低刀具刃磨质量也会增大粗糙度，因此这些措施均无效。", "bloom": "理解", "model": "deepseek/deepseek-chat"}, {"id": "Q_bbbe26be4a", "chapter": "第五章_机械加工表面质量及其控制", "node": "KN_015", "type": "单选", "stem": "根据磨削用量对表面粗糙度影响的几何因素，以下哪种说法是正确的？", "options": ["砂轮速度越高，表面粗糙度值越小", "工件速度增大，表面粗糙度值减小", "砂轮纵向进给增大，表面粗糙度值减小", "磨削用量对表面粗糙度无影响"], "answer": "砂轮速度越高，表面粗糙度值越小", "explanation": "根据知识点原文，砂轮速度越高，单位时间内通过被磨表面的磨粒数越多，因此表面粗糙度值越小。选项B错误，因为工件速度增大时，单位时间内通过被磨表面的磨粒数减少，表面粗糙度值增大。选项C错误，砂轮纵向进给减少时重复磨削次数增加，粗糙度值减小，反之增大。选项D错误，磨削用量是影响表面粗糙度的重要因素。", "bloom": "理解", "model": "deepseek/deepseek-chat"}, {"id": "Q_e0ad2848b4", "chapter": "第五章_机械加工表面质量及其控制", "node": "KN_016", "type": "单选", "stem": "关于砂轮粒度和修整对磨削表面粗糙度的影响，以下说法正确的是？", "options": ["砂轮粒度号数越大，磨粒间距越大，表面粗糙度值越大", "砂轮粒度号数越大，参加磨削的磨粒越多，表面粗糙度值越小", "修整砂轮时金刚石笔纵向进给量越大，砂轮表面磨粒等高性越好，表面粗糙度值越小", "修整进给量减至0.01mm时，磨削表面粗糙度Ra值可达0.5μm以上"], "answer": "砂轮粒度号数越大，参加磨削的磨粒越多，表面粗糙度值越小", "explanation": "正确答案：砂轮粒度号数越大，磨粒越细密，参加磨削的磨粒越多，表面粗糙度值越小。原文指出F36磨粒间距0.475mm，F80磨粒间距0.228mm，间距越小粗糙度值越小。干扰项A将粒度号数与间距的关系颠倒；干扰项C将修整进给量与等高性的关系反向理解；干扰项D将修整进给量0.01mm对应的粗糙度值错误记为0.5μm以上，而原文为0.1~0.2μm。", "bloom": "理解", "model": "deepseek/deepseek-chat"}, {"id": "Q_521b6b36fe", "chapter": "第五章_机械加工表面质量及其控制", "node": "KN_017", "type": "单选", "stem": "砂轮选得太硬或太软都会导致表面粗糙度值增大，其主要原因是？", "options": ["砂轮硬度影响磨粒的脱落时机，太硬时磨钝磨粒不能及时更新，太软时磨粒过早脱落导致磨削作用减弱", "砂轮硬度影响磨粒的锋利程度，太硬时磨粒变钝，太软时磨粒变锋利但磨损快", "砂轮硬度影响磨削温度，太硬时温度过高烧伤工件，太软时温度过低磨削效率低", "砂轮硬度影响砂轮的组织结构，太硬时组织紧密，太软时组织疏松"], "answer": "砂轮硬度影响磨粒的脱落时机，太硬时磨钝磨粒不能及时更新，太软时磨粒过早脱落导致磨削作用减弱", "explanation": "正确答案依据原文：砂轮硬度是指磨粒脱落的难易程度，太硬时磨粒不易脱落，磨钝后无法更新；太软时磨粒易脱落，磨削作用减弱，两者均使粗糙度增大。选项B误将硬度与磨粒锋利性关联；选项C引入原文未提的磨削温度因素；选项D混淆硬度与组织概念。", "bloom": "理解", "model": "deepseek/deepseek-chat"}, {"id": "Q_c53de3821f", "chapter": "第五章_机械加工表面质量及其控制", "node": "KN_018", "type": "单选", "stem": "在磨削加工中，导致工件表层金属塑性变形的主要原因是？", "options": ["磨削速度高、磨粒负前角、磨削比压大、磨削区温度高的综合作用", "仅由磨削区高温引起的金属相变", "仅由磨粒的机械切削作用", "磨削速度低导致挤压加剧"], "answer": "磨削速度高、磨粒负前角、磨削比压大、磨削区温度高的综合作用", "explanation": "正确答案综合了力因素和热因素，符合原文所述。选项A正确；选项B只考虑热因素，忽视力因素；选项C只考虑力因素，忽视热因素；选项D对磨削速度的描述与事实相反，实际磨削速度高。", "bloom": "理解", "model": "deepseek/deepseek-chat"}, {"id": "Q_222667a929", "chapter": "第五章_机械加工表面质量及其控制", "node": "KN_019", "type": "单选", "stem": "根据磨削用量对表面粗糙度的影响规律，以下哪种说法是正确的？", "options": ["增大砂轮速度，表面粗糙度值减小", "增大工件速度，表面粗糙度值减小", "增大背吃刀量，表面粗糙度值减小", "砂轮速度对表面粗糙度无显著影响"], "answer": "增大砂轮速度，表面粗糙度值减小", "explanation": "根据原文，砂轮速度越高，工件材料来不及变形，塑性变形减小，表面粗糙度值明显减小，故A正确。B错误：工件速度增加，塑性变形增加，表面粗糙度值增大，而非减小。C错误：背吃刀量增大，塑性变形增大，表面粗糙度值增大。D错误：砂轮速度对表面粗糙度有显著影响，且是减小作用。", "bloom": "理解", "model": "deepseek/deepseek-chat"}, {"id": "Q_ef8de0d0ee", "chapter": "第五章_机械加工表面质量及其控制", "node": "KN_020", "type": "单选", "stem": "根据砂轮选择对磨削表面粗糙度的影响，以下哪种说法是正确的？", "options": ["砂轮粒度越细，表面粗糙度值越小，因此应尽量选用细粒度砂轮", "砂轮粒度太细时，容易堵塞和烧伤，反而使表面粗糙度值增大", "砂轮硬度越高，磨粒越不易脱落，有利于降低表面粗糙度", "砂轮组织越紧密，磨粒越多，表面粗糙度值越小"], "answer": "砂轮粒度太细时，容易堵塞和烧伤，反而使表面粗糙度值增大", "explanation": "正确答案为B。根据知识点原文，砂轮粒度越细理论上表面粗糙度值越小，但磨粒太细时砂轮易堵塞、导热不良，产生烧伤现象，使表面粗糙度值增大。A选项忽略了细粒度的负面效应；C选项和D选项分别涉及硬度和组织，但原文未讨论这些因素对粗糙度的影响，属于引入无关知识点。", "bloom": "理解", "model": "deepseek/deepseek-chat"}, {"id": "Q_349b874310", "chapter": "第六章_机器装配工艺过程设计", "node": "KN_CH6_001", "type": "单选", "stem": "在机器装配中，将零件、套件、组件和部件按规定的技术要求和顺序组合成机器的过程称为？", "options": ["总装", "组装", "部装", "装配"], "answer": "总装", "explanation": "根据知识点原文，将全部零部件按规定的技术要求和顺序组合成机器的过程称为总装。干扰项中：'组装'是日常用语，非专业术语；'部装'指部件装配，是总装的子过程；'装配'是总称，不够具体。", "bloom": "记忆", "model": "deepseek/deepseek-chat"}, {"id": "Q_a7c0301845", "chapter": "第六章_机器装配工艺过程设计", "node": "KN_CH6_002", "type": "单选", "stem": "关于装配精度与零件精度的关系，以下说法正确的是？", "options": ["零件精度是保证装配精度的基础", "装配精度等于零件精度的简单叠加", "装配精度与零件精度无关", "装配精度只取决于装配方法"], "answer": "零件精度是保证装配精度的基础", "explanation": "正确：根据原文，零件精度是保证装配精度的基础。错误A：原文指出装配精度并不总是等于零件精度的简单叠加；错误B：原文明确零件精度是基础，两者有关；错误C：装配精度取决于零件精度和装配方法，并非只取决于装配方法。", "bloom": "记忆", "model": "deepseek/deepseek-chat"}, {"id": "Q_0e4578ada0", "chapter": "第六章_机器装配工艺过程设计", "node": "KN_CH6_003", "type": "单选", "stem": "在装配尺寸链中，以某项装配精度指标作为封闭环，那么组成环是指：", "options": ["与该项精度指标有关的零件尺寸或位置", "装配过程中最后自然形成的环", "所有零件的全部尺寸", "装配精度要求本身"], "answer": "与该项精度指标有关的零件尺寸或位置", "explanation": "根据装配尺寸链的定义，封闭环是装配精度要求，组成环是查找所有与该项精度指标有关的零件尺寸或位置。选项A正确；选项B描述的是封闭环的特征；选项C扩大了组成环的范围；选项D将封闭环当作组成环，概念混淆。", "bloom": "记忆", "model": "deepseek/deepseek-chat"}, {"id": "Q_c4800fda2e", "chapter": "第六章_机器装配工艺过程设计", "node": "KN_CH6_004", "type": "单选", "stem": "在查找装配尺寸链时，下列哪一项不是必须遵循的原则？", "options": ["最短路线原则", "封闭原则", "对称性原则", "方向性原则"], "answer": "对称性原则", "explanation": "正确答案是“对称性原则”，因为查找装配尺寸链的原则包括封闭原则、最短路线原则、精确性原则和方向性原则，并不包含对称性原则。干扰项A、B、D都是原文中明确列出的原则，学生可能因记忆不牢或混淆而误选。", "bloom": "理解", "model": "deepseek/deepseek-chat"}, {"id": "Q_27d95266f8", "chapter": "第六章_机器装配工艺过程设计", "node": "KN_CH6_005", "type": "单选", "stem": "关于装配尺寸链与工艺尺寸链的区别，以下哪个说法是正确的？", "options": ["装配尺寸链的封闭环是装配精度要求，组成环是多个零件的相关尺寸；工艺尺寸链的封闭环是加工中间接得到的尺寸，组成环是同一零件的工序尺寸。", "装配尺寸链和工艺尺寸链都涉及多个零件，但装配尺寸链的封闭环是加工中间接得到的尺寸。", "装配尺寸链只涉及一个零件，工艺尺寸链涉及多个零件。", "装配尺寸链的封闭环是加工中间接得到的尺寸，组成环是同一零件的工序尺寸；工艺尺寸链的封闭环是装配精度要求，组成环是多个零件的相关尺寸。"], "answer": "装配尺寸链的封闭环是装配精度要求，组成环是多个零件的相关尺寸；工艺尺寸链的封闭环是加工中间接得到的尺寸，组成环是同一零件的工序尺寸。", "explanation": "正确选项准确描述了装配尺寸链和工艺尺寸链的核心区别：装配尺寸链涉及多个零件，封闭环是装配精度要求；工艺尺寸链只涉及一个零件，封闭环是加工中间接得到的尺寸。干扰项1混淆了两者的涉及对象和封闭环定义；干扰项2颠倒了零件数量关系；干扰项3完全互换了两种尺寸链的定义。", "bloom": "理解", "model": "deepseek/deepseek-chat"}, {"id": "Q_9272609a66", "chapter": "第六章_机器装配工艺过程设计", "node": "KN_CH6_007", "type": "计算", "stem": "在完全互换装配法中，已知封闭环公差 T_0 = 0.5 mm，各组成环的传递系数分别为 ξ1 = 1, ξ2 = 1, ξ3 = -1, ξ4 = 1。若各组成环公差按相等公差分配，求各组成环的公差 T_i。", "options": null, "answer": "0.125 mm", "explanation": "根据完全互换装配法的极值法公式，封闭环公差等于各组成环传递系数绝对值与公差乘积之和。按相等公差分配，将各组成环公差设为相同值，代入公式求解即可。", "bloom": "应用", "model": "deepseek/deepseek-chat"}, {"id": "Q_f9d82ba189", "chapter": "第六章_机器装配工艺过程设计", "node": "KN_CH6_008", "type": "计算", "stem": "某轴孔配合采用大数互换装配法，已知封闭环公差要求T0=0.12mm，有3个组成环，各组成环的传递系数分别为ξ1=1, ξ2=1, ξ3=1。假设各组成环尺寸分布均为正态分布，且公差按等公差法分配，即T1=T2=T3。试确定各组成环的公差Ti(i=1,2,3)。", "options": null, "answer": "T1=T2=T3=0.0693 mm", "explanation": "根据大数互换装配法的统计公式T0=√(Σ(ξ_i·T_i)²)，在等公差分配且传递系数均为1的条件下，代入封闭环公差求解各组成环公差。", "bloom": "应用", "model": "deepseek/deepseek-chat"}, {"id": "Q_fad430980e", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_001", "type": "单选", "stem": "机械加工精度是指零件加工后的实际几何参数与理想几何参数的符合程度，其中“几何参数”不包括以下哪一项？", "options": ["尺寸", "形状", "表面粗糙度", "相互位置"], "answer": "表面粗糙度", "explanation": "根据知识点原文，加工精度包含尺寸精度、形状精度和位置精度三个方面，几何参数包括尺寸、形状和表面间的相互位置，表面粗糙度属于表面质量范畴，不属于几何参数。干扰项A、B、D均为原文明确提到的几何参数，学生可能混淆表面粗糙度与几何参数，或误认为表面粗糙度是形状精度的一部分。", "bloom": "记忆", "model": "deepseek/deepseek-chat"}, {"id": "Q_a33ef9995d", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_002", "type": "单选", "stem": "在机械加工中，由机床、夹具、刀具和工件构成的一个完整系统称为：", "options": ["工艺系统", "加工系统", "制造系统", "机械系统"], "answer": "工艺系统", "explanation": "根据知识点原文，机床、夹具、刀具和工件构成了一个完整的系统，称之为工艺系统。选项A正确。干扰项B“加工系统”是常见混淆，原文未出现；C“制造系统”范围更广；D“机械系统”过于泛化。", "bloom": "记忆", "model": "deepseek/deepseek-chat"}, {"id": "Q_66298946a4", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_003", "type": "单选", "stem": "在机械加工中，下列哪一项属于与工艺系统初始状态有关的原始误差（几何误差）？", "options": ["工艺系统受力变形", "工件内应力引起的变形", "机床导轨导向误差", "测量误差"], "answer": "机床导轨导向误差", "explanation": "根据知识点原文，与工艺系统初始状态有关的原始误差（几何误差）包括原理误差、定位误差、调整误差、刀具误差、夹具误差、机床主轴回转误差、机床导轨导向误差、机床传动误差。因此机床导轨导向误差属于几何误差。选项A工艺系统受力变形属于动误差，选项B工件内应力引起的变形属于与工艺过程有关的原始误差，选项D测量误差也属于与工艺过程有关的原始误差，故均不正确。", "bloom": "记忆", "model": "deepseek/deepseek-chat"}, {"id": "Q_db888a926e", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_004", "type": "计算", "stem": "外圆车削时，刀尖由正确位置A位移到A'，原始误差δ=0.02mm，与OA夹角φ=30°，工件半径R₀=50mm。试计算加工误差ΔR。", "options": null, "answer": "0.0173mm", "explanation": "根据误差的敏感方向公式ΔR≈δ·cosφ+δ²/(2R₀)，直接代入已知数值计算即可。", "bloom": "应用", "model": "deepseek/deepseek-chat"}, {"id": "Q_fbf3306eba", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_005", "type": "单选", "stem": "某工厂在批量生产齿轮时发现部分齿轮齿形误差超差，工程师首先收集了50个齿轮的实测误差数据，绘制直方图和工序能力图，初步判断误差可能由刀具磨损引起，随后通过调整刀具参数进行试验验证。请问该工程师使用了哪种研究加工精度的方法？", "options": ["先运用统计分析法，再运用单因素分析法", "只使用了统计分析法", "只使用了单因素分析法", "先运用单因素分析法，再运用统计分析法"], "answer": "先运用统计分析法，再运用单因素分析法", "explanation": "根据知识点原文，实际生产中两种方法常结合应用：一般先用统计分析法寻找误差出现规律，初步判断原因，然后运用单因素分析法进行分析、试验。本题中工程师先收集数据绘制图表（统计分析法），再调整参数试验（单因素分析法），符合正确顺序。选项B只用了统计分析法，但统计分析法只能判断误差规律，不能直接确定具体原因；选项C只用了单因素分析法，但单因素分析法通常用于验证，而非初步判断；选项D颠倒了顺序，不符合原文描述。", "bloom": "应用", "model": "deepseek/deepseek-chat"}, {"id": "Q_bc481eabdf", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_007", "type": "单选", "stem": "在滚齿加工中，采用阿基米德蜗杆滚刀代替渐开线蜗杆滚刀加工渐开线齿轮，这属于哪种误差？", "options": ["加工原理误差", "机床几何误差", "刀具磨损误差", "定位误差"], "answer": "加工原理误差", "explanation": "根据知识点原文，加工原理误差包括采用近似的刀具轮廓，如用近似渐开线轮廓的铣刀加工齿轮。阿基米德蜗杆滚刀齿形近似于渐开线，属于近似的刀具轮廓，因此产生加工原理误差。选项B机床几何误差指机床制造、安装误差；选项C刀具磨损是使用中的尺寸变化；选项D定位误差是工件定位不准所致。三者均与采用近似刀具轮廓无关。", "bloom": "分析", "model": "deepseek/deepseek-chat"}, {"id": "Q_086f887142", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_008", "type": "单选", "stem": "机床主轴回转误差中，实际回转轴线相对于理想回转轴线在径向的变动量称为：", "options": ["径向圆跳动", "轴向窜动", "角度摆动", "圆度误差"], "answer": "径向圆跳动", "explanation": "根据知识点原文，主轴回转误差的三种基本形式中，径向圆跳动定义为实际回转轴线相对于理想回转轴线在径向的变动量。轴向窜动是轴向变动，角度摆动是倾角变动，而圆度误差是加工结果，不是误差形式。", "bloom": "记忆", "model": "deepseek/deepseek-chat"}, {"id": "Q_a61df517e5", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_009", "type": "单选", "stem": "关于主轴回转精度的影响因素，以下说法正确的是：", "options": ["滑动轴承主轴的回转精度主要受轴颈和轴承内孔的圆度误差、波度及表面粗糙度影响", "滚动轴承主轴的间隙对回转精度无影响，可通过预加载荷消除", "液体静压轴承和空气静压轴承没有均化误差的作用，精度低于普通滚动轴承", "提高主轴和箱体轴承孔的加工精度对提高主轴回转精度没有帮助"], "answer": "滑动轴承主轴的回转精度主要受轴颈和轴承内孔的圆度误差、波度及表面粗糙度影响", "explanation": "正确选项直接来自原文：对于滑动轴承，主轴轴颈和轴承内孔的圆度误差、波度及表面粗糙度是主要影响因素。选项B错误，因为轴承间隙会引起回转误差，预加载荷可消除间隙但不能说间隙无影响；选项C错误，原文明确指出静压轴承有均化误差作用，可获得极高回转精度；选项D错误，原文提到提高主轴和箱体轴承孔加工精度是提高主轴回转精度的措施之一。", "bloom": "理解", "model": "deepseek/deepseek-chat"}, {"id": "Q_1db195b4e9", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_010", "type": "单选", "stem": "在卧式车床的导轨导向误差中，对加工精度影响最大的是哪种误差？", "options": ["导轨在水平面内的直线度误差", "导轨在垂直面内的直线度误差", "前后导轨的平行度误差（扭曲）", "导轨与主轴轴线的平行度误差和垂直度误差"], "answer": "导轨在水平面内的直线度误差", "explanation": "根据原文，卧式车床导轨在水平面内的直线度误差直接反映为工件半径方向的误差，处于误差敏感方向，对加工精度影响最大；而导轨在垂直面内的直线度误差处于误差不敏感方向，影响很小；前后导轨平行度误差（扭曲）主要影响工件圆柱度；导轨与主轴轴线的平行度和垂直度误差影响相对较小。因此正确选项为A。", "bloom": "理解", "model": "deepseek/deepseek-chat"}, {"id": "Q_e186fb3fdd", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_011", "type": "单选", "stem": "在机床传动链中，为了减小传动链误差对加工精度的影响，下列哪项措施是最有效的？", "options": ["采用降速传动，使末端传动副的降速比尽可能大", "增加传动环节，以分担误差", "提高所有传动元件的精度至相同等级", "采用升速传动，以提高传动效率"], "answer": "采用降速传动，使末端传动副的降速比尽可能大", "explanation": "正确答案是采用降速传动，因为末端传动副的降速比越大，前面各传动元件的误差对末端运动的影响越小，从而有效减小传动链误差。干扰项A增加传动环节会引入更多误差，反而可能增大误差；干扰项B均匀提高精度忽略了末端元件的关键作用；干扰项C升速传动会放大误差，不利于减小传动链误差。", "bloom": "理解", "model": "deepseek/deepseek-chat"}, {"id": "Q_622a869188", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_012", "type": "单选", "stem": "根据知识点原文，下列关于刀具误差对加工精度影响的说法中，正确的是：", "options": ["普通车刀的制造误差对加工精度无直接影响", "定尺寸刀具的几何形状误差仅影响加工尺寸精度", "成形刀具的刃口形状误差主要影响加工尺寸精度", "展成刀具的制造和刃磨误差不影响齿形精度"], "answer": "普通车刀的制造误差对加工精度无直接影响", "explanation": "正确答案是A，因为原文明确说明“一般刀具（如普通车刀、铣刀等）的制造误差对加工精度无直接影响”。选项B错误，因为定尺寸刀具的几何形状误差影响的是形状精度而非尺寸精度；选项C错误，成形刀具刃口形状误差直接影响形状精度而非尺寸精度；选项D错误，展成刀具的制造和刃磨误差影响齿形精度。", "bloom": "理解", "model": "deepseek/deepseek-chat"}, {"id": "Q_2ac85e158c", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_013", "type": "单选", "stem": "在机械加工中，调整误差的产生最根本是因为：", "options": ["为使刀具切削刃与工件定位基准之间获得正确的相对位置而进行调整时产生的误差", "机床导轨与主轴回转轴线的平行度误差", "工件定位基准与设计基准不重合引起的误差", "刀具磨损导致的尺寸变化"], "answer": "为使刀具切削刃与工件定位基准之间获得正确的相对位置而进行调整时产生的误差", "explanation": "正确答案直接来源于知识点原文：调整误差的定义。干扰项A是机床几何误差，属于工艺系统几何误差的另一类；干扰项B是定位误差中的基准不重合误差；干扰项C是加工过程中的刀具磨损误差，均与调整误差概念不同。", "bloom": "理解", "model": "deepseek/deepseek-chat"}, {"id": "Q_47e2ebaae4", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_014", "type": "计算", "stem": "某工艺系统由机床、夹具、刀具和工件四部分组成，其刚度分别为：k_jc = 50000 N/mm, k_jj = 80000 N/mm, k_dj = 60000 N/mm, k_gj = 40000 N/mm。试计算该工艺系统的总刚度k（单位：N/mm）。", "options": null, "answer": "13483.5 N/mm", "explanation": "根据工艺系统刚度串联公式，先计算各部件刚度的倒数之和，再取倒数得到总刚度。", "bloom": "应用", "model": "deepseek/deepseek-chat"}, {"id": "Q_e659033c54", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_015", "type": "单选", "stem": "在车削光轴时，由于切削力作用点位置变化，工件加工后通常呈现什么形状？", "options": ["腰鼓形（两端细、中间粗）", "马鞍形（两端粗、中间细）", "锥形（一端粗、一端细）", "喇叭形（一端大、一端小）"], "answer": "腰鼓形（两端细、中间粗）", "explanation": "根据知识点原文，车削光轴时切削力作用点位置变化导致工艺系统变形量不同，工件加工后呈腰鼓形（两端细、中间粗）。干扰项马鞍形是中间变形大导致中间细，与实际相反；锥形和喇叭形通常与头尾架刚度差异或导轨误差相关，不是切削力作用点位置变化导致的典型形状。", "bloom": "记忆", "model": "deepseek/deepseek-chat"}, {"id": "Q_d3b51576eb", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_016", "type": "计算", "stem": "在车床上加工一批外圆毛坯，已知毛坯的径向跳动误差Δ_m=0.5mm，工艺系统刚度k_s=2000N/mm。第一次进给时径向切削力F_p1=800N，第二次进给时径向切削力F_p2=400N。试计算经过两次进给后工件的残余误差Δ_w。", "options": null, "answer": "0.04mm", "explanation": "根据误差复映规律，先分别计算每次进给的复映系数，再求总复映系数，最后乘以毛坯误差得到工件残余误差。", "bloom": "应用", "model": "deepseek/deepseek-chat"}, {"id": "Q_77ac66bfeb", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_001", "type": "单选", "stem": "机械加工精度是指零件加工后的实际几何参数与理想几何参数的符合程度，以下哪项正确描述了其包含的几何参数？", "options": ["仅包含尺寸精度", "包含尺寸精度、形状精度和位置精度", "仅包含形状精度", "包含位置精度和形状精度，但不包含尺寸精度"], "answer": "包含尺寸精度、形状精度和位置精度", "explanation": "正确答案包含所有三个几何参数：尺寸、形状和位置。干扰项中，'仅包含尺寸精度'和'仅包含形状精度'忽略了其他参数，而'包含位置精度和形状精度，但不包含尺寸精度'也忽略了尺寸精度。认知误区包括忽略尺寸、形状和位置参数，或错误地将参数分类。", "bloom": "记忆", "model": "xinghuo/xop3qwen1b7"}, {"id": "Q_eb8b037ad2", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_002", "type": "单选", "stem": "工艺系统的误差被称为原始误差，这是因为在加工过程中，工艺系统的误差是'因'，而加工误差是'果'。请判断以下说法是否正确。", "options": ["工艺系统的误差是加工误差的根源，因此称为原始误差。", "工艺系统包含机床、夹具、刀具和工件，但不包括工件本身。", "原始误差是加工误差的直接表现，因此工艺系统误差是加工误差的根源。", "加工误差是工艺系统误差的总和，因此工艺系统误差是加工误差的组成部分。"], "answer": "工艺系统的误差是加工误差的根源，因此称为原始误差。", "explanation": "正确答案是第一项，因为工艺系统误差是加工误差的根源，称为原始误差。其他选项中，第二项混淆了工艺系统与加工系统的概念，第三项混淆了‘因’与‘果’的关系，第四项错误地认为工艺系统误差是加工误差的组成部分。", "bloom": "记忆", "model": "xinghuo/xop3qwen1b7"}, {"id": "Q_2d561904e6", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_004", "type": "计算", "stem": "某外圆车削加工中，刀尖原始误差δ=0.02mm，OA半径R₀=50mm，误差方向与OA夹角φ=60°。求加工误差ΔR。", "options": null, "answer": "0.010004mm", "explanation": "根据公式ΔR≈δ·cosφ+δ²/(2R₀)，代入已知条件计算得到加工误差ΔR。", "bloom": "应用", "model": "xinghuo/xop3qwen1b7"}, {"id": "Q_f726848947", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_007", "type": "单选", "stem": "加工原理误差是指由于采用了近似的加工运动方式或近似的刀具轮廓而产生的误差。例如用成形铣刀加工齿轮时，由于铣刀齿形是近似的渐开线轮廓；用滚刀滚切齿轮时，由于滚刀齿数有限，实际切削过程是不连续的；在数控机床上加工复杂曲面时采用直线或圆弧插补等，都会产生加工原理误差。", "options": ["加工原理误差是由于机床几何精度不足引起的", "加工原理误差是由于刀具磨损造成的", "加工原理误差与工件在夹具中的定位误差有关", "加工原理误差是由于采用近似的加工运动方式或近似的刀具轮廓而产生的"], "answer": "加工原理误差是由于采用近似的加工运动方式或近似的刀具轮廓而产生的", "explanation": "正确答案解释：加工原理误差是由于采用了近似的加工运动方式或近似的刀具轮廓而产生的误差，属于加工过程中的原理性误差，与机床几何精度无关。干扰项中，第一项错误地归因于机床几何精度，属于认知误区1；第二项混淆了原理性近似与刀具磨损，属于认知误区2；第三项将加工原理误差与定位误差混为一谈，属于认知误区3。", "bloom": "分析", "model": "xinghuo/xop3qwen1b7"}, {"id": "Q_059ce51372", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_009", "type": "单选", "stem": "影响主轴回转精度的主要因素是什么？", "options": ["轴承误差", "主轴轴颈和轴承内孔的圆度误差", "滚动轴承的间隙", "液体静压轴承的均化作用"], "answer": "轴承误差", "explanation": "正确答案是轴承误差，因为知识点明确指出影响主轴回转精度的主要因素是轴承误差。干扰项中，'主轴轴颈和轴承内孔的圆度误差'是滑动轴承的误差，而'滚动轴承的间隙'是滚动轴承的误差，但并非主轴回转精度的主要因素。'液体静压轴承的均化作用'虽然正确，但不是题目问的‘主要因素’。", "bloom": "理解", "model": "xinghuo/xop3qwen1b7"}, {"id": "Q_fa63b204a9", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_010", "type": "单选", "stem": "导轨在垂直面内的直线度误差对加工精度的影响程度如何？", "options": ["影响最大", "影响较小", "影响最大且不敏感", "影响最大且敏感"], "answer": "影响较小", "explanation": "正确答案是'影响较小'，因为导轨在垂直面内的直线度误差处于误差不敏感方向，对加工精度影响较小。干扰项错误地认为垂直面内误差影响最大，而实际上它处于误差不敏感方向，影响很小。", "bloom": "理解", "model": "xinghuo/xop3qwen1b7"}, {"id": "Q_385a9a0a0d", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_014", "type": "计算", "stem": "已知机床刚度为5000 N/mm，夹具刚度为200 N/mm，刀具刚度为100 N/mm，工件刚度为10 N/mm，求工艺系统的总刚度。", "options": null, "answer": "8.6806 N/mm", "explanation": "根据工艺系统刚度公式，将各部分刚度代入公式计算总刚度，最终得到总刚度约为8.6806 N/mm。", "bloom": "应用", "model": "xinghuo/xop3qwen1b7"}, {"id": "Q_731a23d176", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_015", "type": "单选", "stem": "当切削力作用点沿工件轴向移动时，工艺系统各处的变形量不同，导致工件产生形状误差。以车削光轴为例，在车刀切削刃运动到不同位置时，工艺系统在切削力作用下的变形量由机床头架、尾座和工件的变形综合决定。工件加工后呈腰鼓形（两端细、中间粗），这是由切削力作用点位置变化引起的。变形量计算：y=y_tj+(y_wz-y_tj)x/L+y_gj，其中y_tj和y_wz分别为头架和尾座的变形量。机床部件的刚度通常由实验测定，采用静刚度测定法或生产状态测定法。", "options": ["工件加工后呈马鞍形（两端粗、中间细）", "工件加工后呈腰鼓形（两端细、中间粗）", "头架和尾座刚度相同，变形量对称", "切削力作用点位置变化不会影响工件形状误差"], "answer": "工件加工后呈腰鼓形（两端细、中间粗）", "explanation": "正确答案为工件加工后呈腰鼓形（两端细、中间粗），这是由切削力作用点位置变化引起的。干扰项中，误将腰鼓形与马鞍形混淆，认为中间变形小则中间细，是认知误区1。头架和尾座刚度不同导致的变形不对称是干扰项2的错误原因。切削力作用点位置变化会影响工件形状误差，干扰项3是错误认知，混淆了形状误差的类型。", "bloom": "记忆", "model": "xinghuo/xop3qwen1b7"}, {"id": "Q_cdfbdfbe6a", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_001", "type": "单选", "stem": "根据机械加工精度的概念，以下哪项完整地包含了零件加工精度的三个方面？", "options": ["尺寸精度、形状精度和位置精度", "仅尺寸精度", "尺寸精度和位置精度", "形状精度和位置精度"], "answer": "尺寸精度、形状精度和位置精度", "explanation": "正确答案为“尺寸精度、形状精度和位置精度”，因为原文明确指出“零件的加工精度包含三个方面：尺寸精度、形状精度和位置精度”。干扰项“仅尺寸精度”对应“学生可能误以为尺寸是唯一考虑的几何参数”的认知误区；“尺寸精度和位置精度”对应“学生可能忽略形状参数”的认知误区；“形状精度和位置精度”对应“学生可能忽略尺寸精度”的认知误区。", "bloom": "记忆", "model": "ali_glm/glm-5.2"}, {"id": "Q_d3238fdc9a", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_002", "type": "单选", "stem": "在机械加工中，由机床、夹具、刀具和工件构成的完整系统被称为：", "options": ["工艺系统", "加工系统", "制造系统", "机械系统"], "answer": "工艺系统", "explanation": "根据知识点原文，在机械加工中，机床、夹具、刀具和工件构成了一个完整的系统，称之为工艺系统。选项“加工系统”对应混淆工艺系统与加工系统概念的误区；选项“制造系统”对应误用更广义概念替代的误区；选项“机械系统”对应将特定加工系统泛化为一般机械装置的误区。", "bloom": "记忆", "model": "ali_glm/glm-5.2"}, {"id": "Q_fff6f4b8d2", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_003", "type": "单选", "stem": "在活塞精镗销孔工序中，原始误差可归纳为两大类。下列误差中，属于与工艺系统初始状态有关的原始误差（几何误差）的是哪一项？", "options": ["机床主轴回转误差", "工艺系统受力变形", "工件残余应力引起的变形", "测量误差"], "answer": "机床主轴回转误差", "explanation": "根据知识点原文，原始误差归纳为两大类：与工艺系统初始状态有关的原始误差（几何误差）包括原理误差、定位误差、调整误差、刀具误差、夹具误差、机床主轴回转误差、机床导轨导向误差、机床传动误差；与工艺过程有关的原始误差（动误差）包括工艺系统受力变形、受热变形、刀具磨损、测量误差、工件残余应力引起的变形。因此，机床主轴回转误差属于与工艺系统初始状态有关的几何误差，为正确选项。干扰项中，工艺系统受力变形属于加工过程中的动误差，误将其归为几何误差属于认知误区；工件残余应力引起的变形属于与工艺过程有关的原始误差，误将其归为初始状态误差属于认知误区；测量误差同样属于与工艺过程有关的原始误差，误将其归为几何误差属于认知误区。", "bloom": "记忆", "model": "ali_glm/glm-5.2"}, {"id": "Q_0e2baf33b6", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_005", "type": "单选", "stem": "某工厂在批量生产中发现一批工件的加工误差超差，质量工程师希望尽快有效地找出影响加工精度的主要原因。根据研究加工精度的方法，以下哪种做法是正确的？", "options": ["先用统计分析法寻找误差出现的规律，初步判断可能原因，再运用单因素分析法进行分析、试验以找出主要原因", "直接运用统计分析法对实测数据进行处理，即可单独确定产生加工误差的具体原因", "直接运用单因素分析法对某一确定因素进行测试实验，以单独查找批量生产中的误差原因", "先用单因素分析法分析、试验寻找可能原因，再运用统计分析法寻找误差出现的规律"], "answer": "先用统计分析法寻找误差出现的规律，初步判断可能原因，再运用单因素分析法进行分析、试验以找出主要原因", "explanation": "正确选项符合知识点原文中“两种方法常结合起来应用”的描述：实际生产中一般先用统计分析法寻找误差出现规律、初步判断可能原因，然后运用单因素分析法进行分析、试验，以便迅速有效地找出影响加工精度的主要原因。干扰项1错在认为统计分析法可单独确定具体原因，忽略了单因素分析法的验证作用；干扰项2错在认为单因素分析法可单独用于批量生产中的误差原因查找，忽视了统计分析法先行的步骤；干扰项3错在颠倒了两种方法的先后顺序，实际应用中应先统计后单因素。", "bloom": "应用", "model": "ali_glm/glm-5.2"}, {"id": "Q_a5190f518e", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_006", "type": "单选", "stem": "根据ISO 9000:2015的定义，全面质量管理（TQM）的基础是？", "options": ["全员参与", "质量检验", "成本控制", "顾客满意"], "answer": "全员参与", "explanation": "根据知识点原文，ISO 9000:2015对全面质量管理的定义明确指出其“以全员参与为基础”，因此正确答案为“全员参与”。干扰项“质量检验”对应了将全面质量管理与传统质量管理混淆的认知误区；干扰项“成本控制”对应了忽略全员参与而误以成本控制为基础的认知误区；干扰项“顾客满意”对应了将目的（顾客满意）误认为基础的认知误区，原文明确顾客满意是目的而非基础。", "bloom": "记忆", "model": "ali_glm/glm-5.2"}, {"id": "Q_e9d0c2f022", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_007", "type": "单选", "stem": "某工厂在数控机床上加工复杂曲面零件时，采用直线插补方式逼近曲面轮廓。关于由此产生的误差及其原因，下列分析正确的是？", "options": ["该误差属于加工原理误差，是由于采用了近似的加工运动方式所致；在保证加工精度的前提下，这种近似方法有助于简化机床结构、降低成本和提高效率", "该误差属于机床几何误差，是由于数控机床各坐标轴的直线运动导轨本身的制造精度不足所导致的", "该误差属于刀具磨损误差，是由于直线插补过程中刀具与工件接触点不断变化，导致刀具切削刃快速磨损而引起的", "该误差属于定位误差，是由于工件在机床夹具上的安装位置不准确，导致插补轨迹与工件实际基准发生偏移所致"], "answer": "该误差属于加工原理误差，是由于采用了近似的加工运动方式所致；在保证加工精度的前提下，这种近似方法有助于简化机床结构、降低成本和提高效率", "explanation": "正确选项准确指出了数控加工采用直线插补属于近似的加工运动方式，由此产生的误差是加工原理误差，且符合知识点中'在保证加工精度的前提下，采用近似的加工方法可以简化机床结构和刀具设计，降低生产成本，提高生产效率'的论述。干扰项A错在将原理误差归因于机床导轨的制造精度，属于'误将采用近似加工运动方式产生的误差归因于机床本身的几何精度问题'；干扰项B错在将插补逼近与刀具磨损联系起来，属于'混淆了原理性近似与刀具使用中的磨损现象'；干扰项C错在将原理误差归结为夹具安装不准，属于'将加工原理误差与工件在夹具中的定位误差混为一谈'。", "bloom": "分析", "model": "ali_glm/glm-5.2"}, {"id": "Q_682df411c2", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_008", "type": "单选", "stem": "下列关于机床主轴回转误差基本形式的说法中，正确的是：", "options": ["机床主轴回转误差可分解为径向圆跳动、轴向窜动和角度摆动三种基本形式", "机床主轴回转误差可分解为径向圆跳动、轴向窜动和圆度误差三种基本形式", "机床主轴回转误差可分解为径向圆跳动、轴向窜动和圆柱度三种基本形式", "机床主轴回转误差可分解为径向圆跳动、轴向窜动和倾角变动三种基本形式"], "answer": "机床主轴回转误差可分解为径向圆跳动、轴向窜动和角度摆动三种基本形式", "explanation": "根据知识点原文，主轴回转误差可分解为径向圆跳动、轴向窜动和角度摆动三种基本形式，故正确选项为第一项。第二项将圆度误差当作基本形式，属于混淆了误差形式与加工结果（圆度误差是径向圆跳动对车削或镗削加工引起的加工误差，而非误差形式本身）。第三项将圆柱度当作基本形式，同样属于混淆了误差形式与加工结果（圆柱度是角度摆动引起的加工误差）。第四项将倾角变动当作基本形式名称，属于混淆了误差形式名称与其定义描述，原文中并列的三种基本形式名称是角度摆动，倾角变动仅是角度摆动的定义描述。", "bloom": "记忆", "model": "ali_glm/glm-5.2"}, {"id": "Q_a3ca6ee642", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_009", "type": "单选", "stem": "关于影响主轴回转精度的轴承误差及其改善措施，下列说法正确的是？", "options": ["对于滚动轴承，内外环滚道的圆度误差、波度、滚动体尺寸不一致以及轴承间隙等均会引起主轴回转误差", "对于滚动轴承，只有内外环滚道的圆度误差会影响主轴回转精度，轴承间隙对精度无影响", "液体静压轴承和空气静压轴承由于缺乏误差均化作用，其回转精度较低，不宜用于高精度场合", "采用高精度轴承和预加载荷消除间隙无效，只能依靠提高主轴和箱体轴承孔的加工精度来提高回转精度"], "answer": "对于滚动轴承，内外环滚道的圆度误差、波度、滚动体尺寸不一致以及轴承间隙等均会引起主轴回转误差", "explanation": "正确选项符合知识点原文：对于滚动轴承，内外环滚道的圆度误差、波度、滚动体尺寸不一致以及轴承间隙等都会引起主轴回转误差。干扰项1错在认为圆度误差是唯一影响因素且忽略间隙的影响；干扰项2错在认为静压轴承无均化作用且精度低，实际上均化作用使其精度极高；干扰项3错在认为提高相关零件加工精度无效，实际上提高主轴和箱体轴承孔的加工精度是重要措施之一，且忽略了采用高精度轴承和预加载荷消除间隙的作用。", "bloom": "理解", "model": "ali_glm/glm-5.2"}, {"id": "Q_b57c2d0e63", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_010", "type": "单选", "stem": "在卧式车床中，关于机床导轨导向误差对加工精度影响的下列说法，正确的是哪一项？", "options": ["导轨在水平面内的直线度误差直接反映为工件半径方向的误差，对加工精度影响最大", "导轨在垂直面内的直线度误差会引起工件半径方向的显著变化，对加工精度影响最大", "前后导轨的平行度误差（扭曲）主要影响工件圆柱度，是对加工精度影响最大的误差", "导轨与主轴轴线的平行度误差和垂直度误差直接反映为工件半径方向的误差，对加工精度影响最大"], "answer": "导轨在水平面内的直线度误差直接反映为工件半径方向的误差，对加工精度影响最大", "explanation": "根据知识点原文，在卧式车床中，导轨在水平面内的直线度误差直接反映为工件半径方向的误差，处于误差敏感方向，因此对加工精度影响最大，故正确选项为A。干扰项B错误在于误认为垂直面内误差影响最大，实际上其处于误差不敏感方向，影响很小；干扰项C错误在于误认为扭曲误差影响最大，实际上扭曲主要影响工件圆柱度；干扰项D错误在于混淆了导轨与主轴轴线的平行度误差和垂直度误差的影响程度，原文未将其列为影响最大的误差。", "bloom": "理解", "model": "ali_glm/glm-5.2"}, {"id": "Q_5e1ce4e71c", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_012", "type": "单选", "stem": "关于刀具误差与夹具误差对加工精度的影响，下列说法正确的是？", "options": ["定尺寸刀具的几何形状误差影响加工形状精度", "定尺寸刀具的几何形状误差影响加工尺寸精度", "成形刀具的刃口形状误差影响加工尺寸精度", "一般刀具的制造误差直接影响加工精度"], "answer": "定尺寸刀具的几何形状误差影响加工形状精度", "explanation": "根据知识点原文，定尺寸刀具的尺寸精度直接影响加工尺寸精度，而其几何形状误差影响加工形状精度，故A选项正确。B选项错误，混淆了定尺寸刀具的尺寸精度与几何形状误差的影响；C选项错误，误以为成形刀具刃口形状误差影响尺寸精度，原文明确其影响加工表面形状精度；D选项错误，与原文相反，一般刀具的制造误差对加工精度无直接影响。", "bloom": "理解", "model": "ali_glm/glm-5.2"}, {"id": "Q_56dce1cd06", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_013", "type": "单选", "stem": "下列关于调整误差的表述，正确的是：", "options": ["调整误差是指在机械加工中，为使刀具切削刃与工件定位基准之间获得正确的相对位置而进行调整时产生的误差", "调整误差主要来源于机床部件本身的几何精度问题，如导轨的直线度误差", "调整误差是指在工序尺寸基准与设计基准不重合时所产生的定位误差", "调整误差是由刀具在切削过程中的磨损引起的，属于加工过程中的动态误差"], "answer": "调整误差是指在机械加工中，为使刀具切削刃与工件定位基准之间获得正确的相对位置而进行调整时产生的误差", "explanation": "正确选项直接来源于知识点原文对调整误差的定义。干扰项1错在将调整误差与机床几何误差混淆，调整误差针对的是调整过程而非机床部件本身的精度；干扰项2错在混淆了调整误差与基准不重合误差，调整误差关注的是刀具与定位基准相对位置的调整过程，而非基准选择问题；干扰项3错在将调整误差与刀具磨损混淆，刀具磨损是加工过程中的动态过程，而调整误差在调整时就已经产生。", "bloom": "理解", "model": "ali_glm/glm-5.2"}, {"id": "Q_8668a0f8d6", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_014", "type": "计算", "stem": "在车削加工某轴类零件时，工艺系统由机床、夹具、刀具和工件组成。已知机床刚度 k_jc = 40000 N/mm，夹具刚度 k_jj = 50000 N/mm，刀具刚度 k_dj = 60000 N/mm，工件刚度 k_gj = 80000 N/mm。试计算该工艺系统的总刚度 k。", "options": null, "answer": "13483.5 N/mm", "explanation": "工艺系统的总刚度由机床、夹具、刀具和工件各组成部分的刚度串联而成，根据公式 1/k=1/k_jc+1/k_jj+1/k_dj+1/k_gj 先求出总柔度，再取其倒数即为总刚度。", "bloom": "应用", "model": "ali_glm/glm-5.2"}, {"id": "Q_2ff90aadac", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_015", "type": "单选", "stem": "在车床上车削光轴时，当切削力作用点沿工件轴向移动时，工艺系统各处变形量不同，导致工件产生形状误差。根据工艺系统刚度对加工精度的影响，加工后的工件形状为：", "options": ["腰鼓形（两端细、中间粗）", "马鞍形（两端粗、中间细）", "锥形（一端粗、一端细）", "不对称腰鼓形（因头架和尾座刚度不同导致变形不对称）"], "answer": "腰鼓形（两端细、中间粗）", "explanation": "根据知识点原文，在车削光轴时，切削力作用点位置变化导致工艺系统变形量不同，加工后工件呈腰鼓形（两端细、中间粗），故正确答案为腰鼓形。选项“马鞍形”对应误将腰鼓形与马鞍形混淆的认知误区；选项“锥形”对应混淆形状误差类型的认知误区；选项“不对称腰鼓形”对应忽略头架和尾座刚度不同但题目考察典型形状的认知误区，均不符合原文表述。", "bloom": "记忆", "model": "ali_glm/glm-5.2"}, {"id": "Q_cc4f52eb1c", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_016", "type": "计算", "stem": "在车削外圆时，工艺系统刚度 $k_s = 20000 \\text{ N/mm}$。毛坯存在 $\\Delta_m = 0.5 \\text{ mm}$ 的形状误差。进行两次进给加工，第一次进给时径向切削力 $F_{p1} = 100 \\text{ N}$，第二次进给时径向切削力 $F_{p2} = 50 \\text{ N}$。求：(1) 每次进给的误差复映系数 $\\varepsilon_1$ 和 $\\varepsilon_2$；(2) 两次进给后的总误差复映系数 $\\varepsilon_z$；(3) 两次进给后工件的加工误差 $\\Delta_w$。", "options": null, "answer": "$\\varepsilon_1 = 0.005$，$\\varepsilon_2 = 0.0025$，$\\varepsilon_z = 0.0000125$，$\\Delta_w = 0.00000625 \\text{ mm}$", "explanation": "本题考查误差复映规律的应用。首先根据径向切削力与工艺系统刚度计算每次进给的误差复映系数，再根据多次进给的总复映系数公式求出总复映系数，最后根据误差复映系数定义反推加工后工件的误差。", "bloom": "应用", "model": "ali_glm/glm-5.2"}, {"id": "Q_ec3510846e", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_001", "type": "单选", "stem": "关于机械加工精度与加工误差的关系，下列哪项说法是正确的？", "options": ["加工精度越高，加工误差越大", "加工精度和加工误差是同一概念的两种表述", "加工精度的高低通过加工误差的大小来表示", "加工误差越小，加工精度越低"], "answer": "加工精度的高低通过加工误差的大小来表示", "explanation": "正确：根据原文，加工精度和加工误差是从不同角度评定，加工精度的高低通过加工误差的大小来表示，即误差小则精度高。干扰项A误以为精度高误差大，实际相反；B误以为二者是同一概念，实际是不同角度；D误以为误差小精度低，实际误差小精度高。", "bloom": "记忆", "model": "deepseek/deepseek-chat"}, {"id": "Q_132477f132", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_002", "type": "单选", "stem": "在机械加工中，工艺系统误差被称为原始误差，其根本原因是什么？", "options": ["它是加工误差的根源", "它是加工误差的组成部分", "它是最早出现的误差", "它是由工件材料引起的"], "answer": "它是加工误差的根源", "explanation": "正确：工艺系统的误差是‘因’，加工误差是‘果’，因此称为原始误差，即它是加工误差的根源。干扰项A：工艺系统误差并非加工误差的组成部分，而是原因。干扰项B：‘原始’指的是根源，而非时间顺序。干扰项C：原始误差可能来自工艺系统中的任何环节，不限于工件材料。", "bloom": "记忆", "model": "deepseek/deepseek-chat"}, {"id": "Q_21f92ffc1e", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_003", "type": "单选", "stem": "在机械加工中，下列哪一项属于与工艺系统初始状态有关的原始误差（几何误差）？", "options": ["工艺系统受力变形", "工件残余应力引起的变形", "机床主轴回转误差", "测量误差"], "answer": "机床主轴回转误差", "explanation": "正确项：机床主轴回转误差属于与工艺系统初始状态有关的几何误差。干扰项A：工艺系统受力变形属于与工艺过程有关的动误差，不是几何误差。干扰项B：工件残余应力引起的变形属于与工艺过程有关的原始误差，不是与初始状态有关的误差。干扰项C：测量误差属于与工艺过程有关的原始误差，不是几何误差。", "bloom": "记忆", "model": "deepseek/deepseek-chat"}, {"id": "Q_aade2abf94", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_004", "type": "计算", "stem": "在外圆车削中，工件原始半径R₀=50mm，原始误差δ=0.05mm，误差方向与工件法线夹角φ=30°。试计算该原始误差引起的半径上加工误差ΔR。", "options": null, "answer": "0.04333mm", "explanation": "根据误差敏感方向公式ΔR≈δ·cosφ+δ²/(2R₀)，代入已知的δ、φ和R₀，先计算δ·cosφ，再计算δ²/(2R₀)，最后求和得到加工误差。", "bloom": "应用", "model": "deepseek/deepseek-chat"}, {"id": "Q_58f0e8b54f", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_005", "type": "单选", "stem": "某工程师在批量生产中发现一批工件的加工误差超差，他首先收集了100个工件的实测数据，通过直方图和工序能力图分析，初步判断误差可能由刀具磨损引起。为了验证这一判断并确定具体影响程度，他接下来应该采用哪种方法？", "options": ["单因素分析法", "统计分析法", "直接更换刀具后观察效果", "同时采用单因素分析法和统计分析法"], "answer": "单因素分析法", "explanation": "正确：单因素分析法用于研究某一确定因素对加工精度的影响，本题中工程师已通过统计分析法初步判断误差可能由刀具磨损引起，接下来应运用单因素分析法进行试验验证，以确定该因素的具体影响。干扰项A（统计分析法）错误：统计分析法仅用于发现规律和初步判断原因，不能单独确定具体原因。干扰项B（直接更换刀具后观察效果）错误：这是经验做法，缺乏系统分析，不符合研究加工精度的方法。干扰项C（同时采用单因素分析法和统计分析法）错误：实际应用中两种方法有先后顺序，一般先用统计分析法寻找规律，再用单因素分析法验证，而非同时进行。", "bloom": "应用", "model": "deepseek/deepseek-chat"}, {"id": "Q_bd4533e0be", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_006", "type": "单选", "stem": "根据ISO 9000:2015的定义，全面质量管理（TQM）旨在通过什么途径达到长期成功？", "options": ["让顾客满意和本组织所有成员及社会受益", "通过严格的质量检验", "以成本控制为基础", "以质量第一为唯一目标"], "answer": "让顾客满意和本组织所有成员及社会受益", "explanation": "根据ISO 9000:2015的定义，全面质量管理旨在通过让顾客满意和本组织所有成员及社会受益而达到长期成功。选项A正确。选项B错误，因为质量检验是传统质量管理的一部分，不是全面质量管理的途径。选项C错误，全面质量管理以全员参与为基础，而非成本控制。选项D错误，质量第一是基本观点，但目的是让顾客满意和所有成员及社会受益。", "bloom": "记忆", "model": "deepseek/deepseek-chat"}, {"id": "Q_34dfe69876", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_007", "type": "单选", "stem": "在数控机床上采用直线插补加工复杂曲面时，产生的加工原理误差属于下列哪一类？", "options": ["近似的加工运动方式导致的误差", "刀具磨损导致的误差", "机床几何精度不足导致的误差", "工件在夹具中的定位误差"], "a
