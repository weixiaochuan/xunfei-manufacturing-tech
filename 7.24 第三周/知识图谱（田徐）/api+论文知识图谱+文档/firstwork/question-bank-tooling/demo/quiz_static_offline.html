nswer": "近似的加工运动方式导致的误差", "explanation": "加工原理误差是由于采用了近似的加工运动方式或近似的刀具轮廓而产生的。直线插补属于近似的加工运动方式，因此产生的误差是加工原理误差。选项B将原理性近似与刀具磨损混淆；选项C误将误差归因于机床几何精度；选项D混淆了加工原理误差与定位误差。", "bloom": "分析", "model": "deepseek/deepseek-chat"}, {"id": "Q_ccc0ed6197", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_008", "type": "单选", "stem": "在机床主轴回转误差的基本形式中，实际回转轴线相对于理想回转轴线沿轴向的变动量称为：", "options": ["轴向窜动", "径向圆跳动", "角度摆动", "倾角变动"], "answer": "轴向窜动", "explanation": "正确选项为轴向窜动，因为原文明确说明轴向窜动是实际回转轴线沿轴向的变动量。干扰项A径向圆跳动是径向变动，B角度摆动是倾角变动，均与轴向变动不符；D倾角变动是角度摆动的定义描述，不是基本形式名称。", "bloom": "记忆", "model": "deepseek/deepseek-chat"}, {"id": "Q_68b9070468", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_009", "type": "单选", "stem": "关于滚动轴承误差对主轴回转精度的影响，以下哪项说法是正确的？", "options": ["滚动体尺寸不一致会引起主轴回转误差", "轴承间隙对主轴回转精度无影响", "提高主轴和箱体轴承孔的加工精度无法提高主轴回转精度", "圆度误差是唯一影响主轴回转精度的因素"], "answer": "滚动体尺寸不一致会引起主轴回转误差", "explanation": "正确项：根据知识点原文，滚动轴承的滚动体尺寸不一致会引起主轴回转误差，这是原文明确指出的因素之一。干扰项A：认为间隙无影响是错误的，原文指出轴承间隙会引起回转误差。干扰项B：认为提高相关零件加工精度无效是错误的，原文指出这是提高主轴回转精度的重要措施。干扰项C：认为圆度误差是唯一因素是错误的，原文还提到了波度、滚动体尺寸不一致、轴承间隙等多种因素。", "bloom": "理解", "model": "deepseek/deepseek-chat"}, {"id": "Q_6165cf32cc", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_010", "type": "单选", "stem": "在卧式车床的导轨导向误差中，关于导轨扭曲（前后导轨平行度误差）对加工精度的影响，以下说法正确的是？", "options": ["导轨扭曲主要影响工件的圆柱度", "导轨扭曲对加工精度的影响最大", "导轨扭曲处于误差敏感方向，影响显著", "导轨扭曲对工件直径无影响"], "answer": "导轨扭曲主要影响工件的圆柱度", "explanation": "正确选项：根据原文，导轨扭曲（前后导轨平行度误差）使刀尖在水平和垂直方向均产生位移，主要影响工件圆柱度。干扰项A：扭曲并非影响最大的误差，水平面内直线度误差影响最大；干扰项B：扭曲产生的位移不直接处于半径方向的敏感方向，故影响并非显著；干扰项C：扭曲会导致刀尖位移，从而影响工件直径，只是主要影响圆柱度。", "bloom": "理解", "model": "deepseek/deepseek-chat"}, {"id": "Q_f3c01cf2da", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_001", "type": "单选", "stem": "根据机械加工精度的概念，以下关于形状公差、位置公差和尺寸公差之间关系的表述，哪一项是正确的？", "options": ["形状公差应限制在位置公差之内，位置公差应限制在尺寸公差之内", "位置公差应限制在形状公差之内，形状公差应限制在尺寸公差之内", "形状公差应直接限制在尺寸公差之内，无需考虑位置公差", "形状公差、位置公差和尺寸公差三者相互独立，无限制关系"], "answer": "形状公差应限制在位置公差之内，位置公差应限制在尺寸公差之内", "explanation": "正确项准确反映了原文'通常形状公差应限制在位置公差之内，位置公差一般应限制在尺寸公差之内'的表述。干扰项B错误在于混淆公差层次，学生易误解顺序；干扰项C错误在于忽略位置公差的必要性，学生常遗漏中间环节；干扰项D错误在于否认依赖关系，学生可能误判公差独立性。", "bloom": "记忆", "model": "xinghuo_x2/spark-x"}, {"id": "Q_07d2182826", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_002", "type": "单选", "stem": "在机械加工中，关于'原始误差'的说法，下列哪一项是正确的？", "options": ["工艺系统的误差，它是加工误差的根源。", "加工过程中产生的所有误差的总称。", "仅指工件自身的误差。", "时间上最先出现的误差。"], "answer": "工艺系统的误差，它是加工误差的根源。", "explanation": "正确选项符合知识点原文：原始误差被定义为工艺系统的误差，并明确指出它是加工误差的根源（'因'）。干扰项B错误地将原始误差扩大为所有加工误差，混淆了因果关系；干扰项C错误地缩小了误差来源，仅关注工件，忽略了工艺系统的其他要素；干扰项D误解了'原始'的含义，将其视为时间顺序而非因果本质。", "bloom": "记忆", "model": "xinghuo_x2/spark-x"}, {"id": "Q_aee4a3e01b", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_003", "type": "单选", "stem": "在机械加工中，下列哪一项属于与工艺过程有关的原始误差（动误差）？", "options": ["刀具磨损", "夹具误差", "测量误差", "机床主轴回转误差"], "answer": "刀具磨损", "explanation": "根据知识点原文，与工艺过程有关的原始误差（动误差）包括：工艺系统受力变形、受热变形、刀具磨损、测量误差、工件残余应力引起的变形。因此，“刀具磨损”是正确的。其他选项均为与工艺系统初始状态有关的几何误差，属于常见混淆。", "bloom": "记忆", "model": "xinghuo_x2/spark-x"}, {"id": "Q_ae5c01fd47", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_006", "type": "单选", "stem": "根据ISO 9000:2015对全面质量管理的定义，下列哪一项体现了其基本观点？", "options": ["质量第一", "以质量检验为核心基础", "以成本控制为基础", "以顾客满意为唯一目的"], "answer": "质量第一", "explanation": "解析：根据ISO 9000:2015定义，全面质量管理的基本观点是'质量第一'，这体现在产品质量关系到企业生存和发展，应以'质量第一'解决矛盾。选项A正确。选项B错误，属于将传统质量管理中的质量检验混淆为核心基础的认知误区；选项C错误，属于误以为全面质量管理以成本控制为基础的认知误区；选项D错误，属于将顾客满意作为唯一目的而忽略其他受益方的认知误区。", "bloom": "记忆", "model": "xinghuo_x2/spark-x"}, {"id": "Q_15f89d8514", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_007", "type": "单选", "stem": "关于加工原理误差，下列哪项描述是正确的？", "options": ["在保证加工精度的前提下，采用近似的加工方法可以简化机床结构和刀具设计，降低生产成本。", "加工原理误差主要是由于机床本身的几何精度不足造成的。", "加工原理误差与刀具在使用中的磨损现象是相同的。", "加工原理误差等同于工件在夹具中的定位误差。"], "answer": "在保证加工精度的前提下，采用近似的加工方法可以简化机床结构和刀具设计，降低生产成本。", "explanation": "正确项正确，因为它直接源自知识点原文，描述了加工原理误差在实际应用中的优势，即在保证精度下能简化结构和降低成本。干扰项A错误，因为它将原理误差归因于机床几何精度，而原文明确指出误差源于近似运动或刀具轮廓，而非机床本身。干扰项B错误，因为它混淆了原理性近似与刀具磨损，磨损是使用过程中的现象，而原理误差是设计上的近似。干扰项C错误，因为它将原理误差与定位误差等同，定位误差涉及夹具，而原理误差源于加工方法本身。", "bloom": "分析", "model": "xinghuo_x2/spark-x"}, {"id": "Q_4ff165a5de", "chapter": "第四章_机械加工精度及其控制", "node": "KN_CH4_009", "type": "单选", "stem": "为提高主轴回转精度，下列哪项措施是有效的？", "options": ["通过预加载荷消除轴承间隙，并选用高精度等级轴承", "只需关注圆度误差，无需考虑波度或滚动体尺寸一致性", "液体静压轴承不具备均化误差的作用，因此无法达到高回转精度", "提高主轴和箱体轴承孔的加工精度对回转精度没有帮助，应优先更换材料"], "answer": "通过预加载荷消除轴承间隙，并选用高精度等级轴承", "explanation": "正确项有效，因为原文明确指出“采用高精度轴承（如C级、B级）、预加载荷消除间隙”是提高主轴回转精度的重要措施。干扰项B错在将圆度误差当作唯一因素，忽视了波度、滚动体尺寸不一致等；干扰项C错在否认了静压轴承的均化误差作用，与原文“由于有均化误差的作用，可获得极高的回转精度”相悖；干扰项D错在否定提高加工精度的作用，而原文将其列为关键措施之一。", "bloom": "理解", "model": "xinghuo_x2/spark-x"}];
let pool = [], stats = {answered:0, correct:0};

function chapters(){ return [...new Set(DATA.map(q=>q.chapter))]; }
function initFilters(){
  const cs = document.getElementById('chapterSel');
  chapters().forEach(c=>{ const o=document.createElement('option'); o.value=c; o.textContent=c; cs.appendChild(o); });
  cs.onchange = restart; document.getElementById('typeSel').onchange = restart;
  document.getElementById('total').textContent = DATA.length;
}
function restart(){
  const ch = document.getElementById('chapterSel').value;
  const tp = document.getElementById('typeSel').value;
  pool = DATA.filter(q=>(!ch||q.chapter===ch) && (!tp||q.type===tp));
  stats = {answered:0, correct:0};
  render();
}
function render(){
  const box = document.getElementById('quiz'); box.innerHTML='';
  pool.forEach((q,i)=> box.appendChild(card(q,i)));
  updateScore();
}
function card(q,i){
  const el = document.createElement('div'); el.className='card';
  el.innerHTML = `<div><span class="tag">${q.chapter}</span><span class="tag">${q.type}</span>${q.bloom?`<span class="tag">Bloom:${q.bloom}</span>`:''}</div>
    <div class="stem">${i+1}. ${esc(q.stem)}</div>`;
  if(q.type==='单选' && q.options){
    q.options.forEach(opt=>{
      const b=document.createElement('button'); b.className='opt'; b.textContent=opt;
      b.onclick=()=>choose(el,q,opt,b); el.appendChild(b);
    });
  } else {
    // 计算题：给"显示参考答案与步骤"按钮
    const b=document.createElement('button'); b.className='opt'; b.textContent='显示参考答案与解析';
    b.onclick=()=>revealCalc(el,q,b); el.appendChild(b);
  }
  return el;
}
function choose(el,q,opt,btn){
  if(el.dataset.done) return; el.dataset.done=1;
  const correct = (opt===q.answer);
  el.querySelectorAll('.opt').forEach(b=>{
    b.disabled=true;
    if(b.textContent===q.answer) b.classList.add('correct');
    else if(b===btn) b.classList.add('wrong');
  });
  stats.answered++; if(correct) stats.correct++;
  const fb=document.createElement('div'); fb.className='feedback';
  fb.innerHTML = (correct?`<span class="ok">✔ 答对了</span>`:`<span class="bad">✘ 答错了</span> 正确答案：${esc(q.answer)}`)
    + `<div style="margin-top:8px">${esc(q.explanation)}</div>`
    + `<div class="src">来源知识点：${q.node}　·　出题模型：${q.model}</div>`;
  el.appendChild(fb); updateScore();
}
function revealCalc(el,q,btn){
  if(el.dataset.done) return; el.dataset.done=1; btn.disabled=true;
  const fb=document.createElement('div'); fb.className='feedback calc';
  let steps=''; try{ const s=JSON.parse(q.answer); }catch(e){}
  fb.innerHTML = `<div><b>参考答案：</b>${esc(q.answer)}</div>`
    + `<div style="margin-top:8px">${esc(q.explanation)}</div>`
    + `<div class="src">来源知识点：${q.node}　·　出题模型：${q.model}</div>`;
  el.appendChild(fb);
  stats.answered++; // 计算题不判分，只记作已查看
  updateScore();
}
function updateScore(){
  document.getElementById('score').textContent = stats.correct;
  document.getElementById('answered').textContent = stats.answered;
  document.getElementById('progress').textContent = `本次筛选共 ${pool.length} 道`;
}
function esc(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
initFilters(); restart();
</script>
