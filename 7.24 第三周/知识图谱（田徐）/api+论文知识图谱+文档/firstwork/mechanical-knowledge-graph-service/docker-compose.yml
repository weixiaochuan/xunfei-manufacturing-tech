services:
  neo4j:
    image: neo4j:5.26.0
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
    volumes:
      - mechanical_neo4j_data:/data
      - mechanical_neo4j_logs:/logs

volumes:
  mechanical_neo4j_data:
  mechanical_neo4j_logs:
