[project]
name = "manufacturing-graph-demo-backend"
version = "0.1.0"
description = "Manufacturing Context Graph Backend"
requires-python = ">=3.10, <3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "neo4j>=5.20",
    # The graph browser and Neo4j-backed demo only need the base memory API.
    # LLM extraction extras are intentionally omitted so local setup does not
    # require Rust, model downloads, or an external API key.
    "neo4j-agent-memory>=0.4.0,<0.6.0",
    "pydantic-ai>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",  # for fastapi.testclient.TestClient
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
